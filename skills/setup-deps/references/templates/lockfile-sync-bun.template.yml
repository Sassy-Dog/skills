---
# generated-by: sassy-dog:setup-deps | template: lockfile-sync-bun | template-version: 15
#
# Refresh bun.lock on Dependabot npm PRs (the LEGACY npm + sync pairing —
# native `bun` is the default for bun repos; see the render conditions above).
#
# THE PROBLEM THIS SOLVES: Dependabot's npm ecosystem updates package.json but
# does not write bun.lock (a Bun-specific format; only the native bun ecosystem
# writes it). CI then runs `bun install --frozen-lockfile` and rejects the PR.
# Without this workflow, every npm-path PR in a Bun repo is dead on arrival —
# qr-ninja merged 0 of 20 before deleting the ecosystem outright. Security
# updates cannot be opted out of that way, so on this pairing the fix has to
# be here.
#
# Why pull_request_target: Dependabot's GITHUB_TOKEN is read-only by design.
# Pushing the lockfile commit needs write, which only the BASE repo context
# grants. That makes the actor gate below load-bearing, not decorative.
#
# Why an App token rather than GITHUB_TOKEN for the push: a GITHUB_TOKEN push
# lands as github-actions[bot], which (a) does not re-trigger CI on the new
# commit and (b) trips the bot-actor "awaiting approval" gate on any run that
# does appear. The App push re-fires CI normally with no approval step.
#
# Security posture — do not weaken any of these:
#   1. Hard-gated to dependabot[bot], so contributor PR code never reaches a
#      write-capable context.
#   2. `--ignore-scripts` blocks lifecycle scripts (preinstall/postinstall/
#      prepare) during install. Lockfile content does not depend on their
#      output, so the result is functionally identical to a normal install.
#   3. The built-in GITHUB_TOKEN has contents: read only. The step-scoped App
#      token is the sole write credential, and push is the sole privileged op.
#   4. PR head ref/repo funnelled through env:, never inlined into a run:
#      shell. Inlining is the classic Actions script-injection vector.
#   5. The App token's lifetime on disk is bounded to the push step: checkout
#      sets persist-credentials: false and passes no token: at all, and the
#      push authenticates inline from its own env:. Nothing between checkout
#      and push needs repository write, so the credential is never sitting in
#      .git/config inside a workspace holding PR-authored content (issue #232).
#   6. Ephemeral GitHub-hosted runners, hard-coded (version 11, #528, part of
#      #515). The workflow runs bun on PR-authored manifests and the org-wide
#      platform-writer App token (contents and pull-request write on
#      every installed repo) pushes the result. A persistent shared self-hosted runner can carry a
#      PATH-shadowing bun or git, a global gitconfig with core.hooksPath,
#      core.fsmonitor or a credential helper, or a modified tool cache, left by
#      any earlier job in any repo; --ignore-scripts blocks lifecycle scripts
#      but not a poisoned binary. A GitHub-hosted VM starts clean and is
#      destroyed after the job. bun comes from setup-bun at the repo's own pin,
#      never from the image.
#   7. bun and the token never share a VM (version 12; deps-cadence v3 is the
#      precedent). A process bun starts can outlive its step and read a
#      later-minted token from /proc/*/environ, $RUNNER_TEMP or step files, so
#      the work is two jobs, each on its own fresh runner. update-bun-lock runs
#      bun with no secret at all and uploads one artifact, a patch of the
#      install root's bun.lock. push-bun-lock runs no package manager: it
#      checks out, downloads the patch, validates it BEFORE the mint (git's own
#      --summary and --numstat: no create, delete, rename or mode change, no
#      binary hunk, one file, and that file is exactly the install root's
#      bun.lock, a tracked regular file), applies it with hooks off, and only
#      then runs the presence step, the mint and the push.
#   8. The push never puts the token in a URL or in argv. It goes through a
#      one-shot credential helper that reads GH_TOKEN from the environment (the
#      empty helper first clears any other), with system and global git config
#      ignored and every git call passing -c core.hooksPath=/dev/null
#      -c core.fsmonitor=false, since a hook or fsmonitor program would inherit
#      the push step's environment.
#   9. No cache of any kind: no actions/cache, and setup-bun's built-in cache
#      off (no-cache: true on both steps, #551). Under pull_request_target a
#      save lands in the default-branch cache scope, built from an install of
#      the PR head's lockfile, so a poisoned lock could seed a cache the base branch's own
#      workflows restore. Every run is a cold install, which is fine for a
#      workflow that fires only on Dependabot PRs.
#  10. The push is leased (version 13): --force-with-lease on the head ref at the
#      head SHA both jobs checked out, so a branch that moved or was deleted
#      between the jobs (a plain push would recreate it) fails closed.
#
name: Dependabot bun.lock sync

on:
  pull_request_target:
    paths:
      # Scoped to the install root this workflow owns. At the repo root the
      # '{{PKG_DIR}}/' prefix collapses away, leaving the v5 '**/package.json'
      # that a workspaces monorepo depends on; nested, it stops the workflow
      # firing on a sibling project's package.json it cannot sync.
      - '{{PKG_DIR}}/**/package.json'

permissions:
  contents: read

# One run per PR at a time; a second push to the same Dependabot branch queues
# behind the run that is pushing the lockfile rather than racing it. Both jobs
# check out the head SHA the event carried, and the push's --force-with-lease
# on that SHA is the guard: a branch that moved or was deleted fails closed.
concurrency:
  group: dependabot-bun-lock-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # JOB 1 — runs bun, holds NO secret. Its only output is a patch of the install
  # root's bun.lock, uploaded as an artifact. The PR-authored manifests and the
  # package manager live and die on this VM; the App token never exists here.
  update-bun-lock:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      # Git reads no system or global config in any step: nothing left on the
      # VM can inject a hook path, fsmonitor program or credential helper.
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: /dev/null
    steps:
      # No token: and persist-credentials: false. actions/checkout defaults
      # persist-credentials to true, which writes whatever token it was given
      # into .git/config for the rest of the job — in a workspace that holds
      # PR-authored content. Dependabot pushes its head branch to the BASE repo
      # rather than a fork, so the default read-only GITHUB_TOKEN reads this ref
      # fine.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          repository: ${{ env.PR_HEAD_REPO }}
          persist-credentials: false
          fetch-depth: 0

      # bun from the repo's own pin, never the image's: a different bun can
      # write a different lockfile from the one CI then validates, and the
      # image's bun is a binary this job did not choose. Exactly one of the two
      # arms below renders (see the header).
      # {{IF:BUN_PIN_FILE}}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '{{BUN_VERSION_FILE}}'
          no-cache: true
      # {{ENDIF}}
      # {{IF:BUN_PIN_LITERAL}}
      # CI pins bun as a literal, so this copy of it moves only on a re-render.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '{{BUN_VERSION}}'
          no-cache: true
      # {{ENDIF}}

      # Restore the BASE branch's bun.lock, then loose-install. Discarding the
      # PR's lockfile edit matters because a loose `bun install` considers
      # Dependabot's npm-style edit valid and writes nothing — while strict
      # `--frozen-lockfile` in CI still rejects it. Against the pristine base
      # lock, the bumped package.json range genuinely no longer resolves, so
      # Bun re-resolves ONLY that subtree and writes it back strict-valid.
      #
      # v1 deleted bun.lock and regenerated from scratch. That floated every
      # semver range in the workspace: a one-package mobile bump carried a
      # 2,486-line lock diff (qr-ninja#748 — @base-ui/react 1.2→1.6 among
      # ~40 unrelated floats), one of which broke web's type check on every
      # npm PR. Wholesale regeneration also destroys per-package attribution
      # and smuggles an unreviewed all-deps upgrade into an auto-mergeable
      # bump PR — minimal churn is a supply-chain property, not cosmetics.
      #
      # `fetch-depth: 0` above already fetched the base branch. Reuse that
      # remote-tracking ref instead of fetching after checkout: with
      # `persist-credentials: false`, a later network fetch is deliberately
      # unauthenticated and fails for private/internal repositories.
      #
      # Every step below runs IN the install root, and every path it names is
      # relative to that — which preserves v5's root-path shape while a nested
      # render touches only its own lockfile.
      - name: Update bun.lock for the bumped packages only
        # {{IF:NESTED_PKG}}
        working-directory: '{{PKG_DIR}}'
        # {{ENDIF}}
        run: |
          nohooks=(-c core.hooksPath=/dev/null -c core.fsmonitor=false)
          git "${nohooks[@]}" checkout "origin/$PR_BASE_REF" -- bun.lock
          bun install --ignore-scripts

      # Fail-closed assertion (never trust a green that checked nothing): the
      # rewritten lock must satisfy the same strict install CI runs. If the
      # minimal update could not produce a frozen-valid lock, fail HERE with
      # the real error rather than shipping a commit that reddens CI.
      - name: Assert the lock is frozen-valid
        # {{IF:NESTED_PKG}}
        working-directory: '{{PKG_DIR}}'
        # {{ENDIF}}
        run: bun install --ignore-scripts --frozen-lockfile

      # The ONLY thing that leaves this job: the install root's bun.lock, as the
      # difference from the PR head the checkout holds. The pathspec names that
      # one file; --no-renames, --no-ext-diff and --no-textconv keep the patch a
      # plain one. The next job re-checks every line of it anyway.
      - name: Package the lockfile change as a patch
        id: patch
        run: |
          set -euo pipefail
          nohooks=(-c core.hooksPath=/dev/null -c core.fsmonitor=false)
          out="$RUNNER_TEMP/bun-lock-out"
          mkdir -p "$out"
          git "${nohooks[@]}" diff HEAD --binary --no-renames --no-ext-diff --no-textconv -- '{{PKG_DIR}}/bun.lock' > "$out/bun-lock.patch"
          if [ ! -s "$out/bun-lock.patch" ]; then
            echo "::notice::bun.lock unchanged after regeneration — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.patch.outputs.changed == 'true' }}
        with:
          name: bun-lock-patch
          path: ${{ runner.temp }}/bun-lock-out/
          retention-days: 1
          if-no-files-found: error

  # JOB 2 — a FRESH VM that runs no package manager. The patch from job 1 is
  # untrusted: it is checked against the one path this workflow owns and applied
  # with hooks off BEFORE the App token exists.
  push-bun-lock:
    needs: update-bun-lock
    if: ${{ github.actor == 'dependabot[bot]' && needs.update-bun-lock.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          repository: ${{ env.PR_HEAD_REPO }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bun-lock-patch
          path: ${{ runner.temp }}/bun-lock-in

      # Every rule here is about the patch, not about who made it. The one path
      # it may touch is the install root's bun.lock (at the repo root the
      # '{{PKG_DIR}}/' prefix collapses to plain bun.lock), and git itself
      # reports what the patch would do.
      - name: Validate and apply the lockfile patch
        run: |
          set -euo pipefail
          nohooks=(-c core.hooksPath=/dev/null -c core.fsmonitor=false)
          patch="$RUNNER_TEMP/bun-lock-in/bun-lock.patch"
          allowed='{{PKG_DIR}}/bun.lock'
          reject() { echo "::error::Rejected the lockfile patch: $1"; exit 1; }
          [ -s "$patch" ] || reject "the artifact holds no patch"

          # git's own reading of the patch: any create, delete, rename, copy
          # or mode change shows up in --summary.
          summary="$(git "${nohooks[@]}" apply --summary -- "$patch")" || reject "git cannot parse it"
          [ -z "$summary" ] || reject "it creates, deletes, renames, copies or re-modes a file: $(echo "$summary" | tr '\n' ' ')"
          # -z: NUL-terminated records with the path unquoted. Without it git
          # C-quotes a path holding non-ASCII or special characters and no
          # compare ever matches. A file, not a variable: a variable drops NULs.
          numstat="$RUNNER_TEMP/numstat.z"
          git "${nohooks[@]}" apply --numstat -z -- "$patch" > "$numstat" || reject "git cannot parse it"
          [ "$(tr -cd '\0' < "$numstat" | wc -c)" -eq 1 ] || reject "it touches more than one file"
          # No IFS trimming: tab is IFS whitespace, so `read added removed path`
          # would strip a leading or trailing tab from the path and bind a file
          # named <TAB>bun.lock to bun.lock. Split the record on its first two
          # tabs by hand and refuse any path holding a tab or newline.
          while IFS= read -r -d '' rec; do
            added="${rec%%$'\t'*}"; rest="${rec#*$'\t'}"
            removed="${rest%%$'\t'*}"; path="${rest#*$'\t'}"
            case "$path" in
              ''|*$'\t'*|*$'\n'*) reject "a patched path is empty or holds a tab or newline" ;;
            esac
            [ "$added" != "-" ] || reject "$path is a binary change; bun.lock is text"
            # git prints "0 0 path" for a patch it parses but that changes no
            # line (headers only); it never prints an empty numstat for one.
            [ "$added$removed" != "00" ] || reject "it changes nothing"
            [ "$path" = "$allowed" ] || reject "$path is not $allowed"
            mode="$(git "${nohooks[@]}" ls-files -s -- ":(literal)$path" | cut -d' ' -f1)"
            [ "$mode" = "100644" ] || [ "$mode" = "100755" ] \
              || reject "$path is not a tracked regular file (mode '${mode:-untracked}'; a symlink is 120000, a submodule 160000)"
          done < "$numstat"

          git "${nohooks[@]}" apply --index -- "$patch"
          # Belt and braces: what is staged, and only that, is the lockfile.
          [ "$(git "${nohooks[@]}" diff --cached --name-only -z | tr '\0' '\n')" = "$allowed" ] || reject "after applying, something other than $allowed is staged"
          # Captured first so a failing `git status` aborts under set -e; a
          # `$(git status | grep)` would read the failure as a clean tree.
          tree="$(git "${nohooks[@]}" status --porcelain --untracked-files=all)"
          if [ -n "$(grep -v '^M  ' <<<"$tree" || true)" ]; then
            reject "after applying, the tree holds changes outside the index"
          fi

      # Minted only now: after the patch is validated and applied, on a VM that
      # never ran a package manager. The presence step stays immediately before
      # the mint (it names the cause of an empty secret instead of an opaque
      # auth error).
      # A secret this repo cannot reach resolves to the EMPTY STRING, never an
      # error, so the mint below fails as an opaque auth error that reads as
      # unrelated to its cause (issue #178). Name the cause here.
      #
      # Org secrets at `private` visibility cover private + internal repos and
      # EXCLUDE public ones, in the Actions and Dependabot stores alike. Since
      # #186 setup-deps refuses to render ANY of the three App-token workflows
      # into a public repo, so this guard is the backstop for the copies that
      # predate that rule or were hand-copied: it names the cause instead of
      # failing as an opaque auth error.
      - name: Require the app credentials
        env:
          APP_CLIENT_ID: ${{ secrets.PLATFORM_WRITER_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.PLATFORM_WRITER_APP_PRIVATE_KEY }}
        run: |
          missing=
          [ -n "$APP_CLIENT_ID" ] || missing="$missing PLATFORM_WRITER_APP_CLIENT_ID"
          [ -n "$APP_KEY" ]       || missing="$missing PLATFORM_WRITER_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing Dependabot secret(s):$missing — org secrets are private-visibility and do not reach public repositories (Sassy-Dog/skills#178)."
            exit 1
          fi
          echo "App credentials present."

      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PLATFORM_WRITER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLATFORM_WRITER_APP_PRIVATE_KEY }}

      # The only step that needs repository write, and the only one holding
      # the credential. Pushing to an explicit URL rather than to `origin` is
      # what lets the checkout above stay credential-free. The validated patch
      # is already in the index; nothing else is.
      - name: Commit and push bun.lock
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          # Every git call passes nohooks: a hook or fsmonitor program would
          # inherit GH_TOKEN from this step's environment. System and global
          # config are already off (job env).
          nohooks=(-c core.hooksPath=/dev/null -c core.fsmonitor=false)
          if git "${nohooks[@]}" diff --cached --quiet; then
            echo "::error::The validated patch left nothing staged."
            exit 1
          fi
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git "${nohooks[@]}" commit -m "chore(deps): regenerate bun.lock for Dependabot npm bump"
          # The token is never in argv or a URL: the single-quoted helper is
          # expanded by the shell git spawns, which reads GH_TOKEN from the
          # environment at run time. The empty helper first clears any other.
          # The push is leased to the head SHA both jobs checked out: if the
          # branch moved or was deleted since, it fails closed instead of
          # overwriting the new tip or recreating the branch.
          # shellcheck disable=SC2016  # deliberately unexpanded: git's shell expands it
          git "${nohooks[@]}" -c credential.helper= \
            -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
            push --force-with-lease="refs/heads/${PR_HEAD_REF}:${PR_HEAD_SHA}" \
            "https://github.com/${PR_HEAD_REPO}.git" "HEAD:refs/heads/${PR_HEAD_REF}"
