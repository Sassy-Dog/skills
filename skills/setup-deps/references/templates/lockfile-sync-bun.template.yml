#                  different values of one key, a floating pin (latest, 1.3.x)
#                  or a pin that is not exact: STOP and report, render nothing.
#                  So does finding NO pin source at all. Never guess a version.
#                  Every path here is relative to the REPO ROOT, whatever
#                  {{PKG_DIR}} is: the fallback files are read at the repo
#                  root, never inside a nested install root, and
#                  `bun-version-file:` is the path CI wrote (setup-bun resolves
