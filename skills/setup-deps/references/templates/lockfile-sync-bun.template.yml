# directory with a bun.lock and no npm/yarn/pnpm lockfile
# (`misconfigured_tooling`), so the npm lane this would serve opens nothing —
# version or security — and the two reasons once given for keeping the pairing
# there (a repo deliberately on grouped npm, qr-ninja#394; security PRs via the
# npm path) both died with that refusal. convert-npm-lanes.sh reports a copy of
# this workflow on a text bun.lock root as OBSOLETE (SKILL.md §1).
#   runs-on is NOT a fact (version 11): both jobs are hard-coded to
#   ubuntu-latest, see "Security posture" below. There is no {{RUNNER}} and a
#   render never writes a self-hosted label.
#   Version history: 11 moved the job to ubuntu-latest, setup-bun at the repo's
#   pin, a late mint and a credential-helper push (#528, part of #515). 12
#   splits that one job in two so bun never shares a VM with the token (the rule
#   deps-cadence v3 set), and drops the actions/cache step entirely (a save
#   under pull_request_target lands in the default-branch cache scope, built
#   from an install of the PR head's lockfile, which is cache poisoning; #515's
#   "actions/cache keyed on bun.lock" decision is superseded, every run is a
#   cold install). 11 was never released, but its shape changed after review,
#   so the stamp moved. 12 was still unreleased when both jobs began checking
#   out the PR's head SHA rather than its branch name (a branch that moves
#   between the jobs then makes the push non-fast-forward and fail closed) and a
#   per-PR concurrency group was added, so those two changes did not move the
#   stamp again. 13 leases the push (--force-with-lease on the head ref at the
#   head SHA both jobs checked out), so a branch that moved or was deleted
#   between the jobs fails closed rather than being overwritten or recreated
#   (#529, which gave lockfile-sync-pod the same lease; a nit on #534). 15 sets
#   `no-cache: true` on both setup-bun steps: setup-bun saves its own
#   `bun-<hash>` cache after the job, and under pull_request_target that save
#   lands in the default-branch scope (#551).
#   # {{IF:BUN_PIN_FILE}} / # {{IF:BUN_PIN_LITERAL}}
#                → keep exactly ONE of the two setup-bun steps and delete the
