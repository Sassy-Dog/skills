---
# generated-by: sassy-dog:setup-deps | template: dependabot-auto-merge | template-version: 5
#
# Auto-merge green Dependabot PRs so security bumps do not rot in the queue.
#
# Policy: minor/patch merge automatically — the required checks are the gate.
# Semver-major is NEVER auto-merged; it gets a comment and waits for a human,
# because a major is an API break that a green build does not disprove.
#
# FAIL CLOSED, in two places (template version 4, 2026-10-11):
#   - The merge step matches update-type EXPLICITLY: semver-minor or
#     semver-patch, nothing else. Versions 1-3 merged on `!= semver-major`, so
#     an empty or unrecognised update-type — the value fetch-metadata emits when
#     it cannot classify a bump — enqueued unreviewed. Everything that is not
#     an explicit minor/patch gets the "held for a human" comment instead,
#     naming the update-type it saw. Docker digest bumps report semver-patch,
#     so this holds nothing that merged cleanly before.
#   - The job requires BOTH the PR author AND the triggering actor to be
#     dependabot[bot]. Author alone admits a human (or agent) who pushes a
#     commit to a Dependabot branch: the `synchronize` run is theirs, it mints
#     the write token, and their unreviewed commit is enqueued. The lockfile
#     templates have gated on github.actor all along; this one now matches.
#
# Why a minted GitHub App token instead of GITHUB_TOKEN:
#   Dependabot-triggered runs get a READ-ONLY GITHUB_TOKEN by design, and
#   merging needs write. The App credentials are read from the DEPENDABOT
#   secrets store (org-level, visibility private+internal) — NOT the Actions
#   store. A Dependabot run cannot see Actions secrets at all; this is the most
#   common reason a copied version of this workflow silently no-ops.
#
# runs-on is NOT a fact (version 5). This job mints the org-wide platform-writer
# App token and hands it to the runner's local `gh`, so it runs only on an
# ephemeral GitHub-hosted runner: a persistent shared runner can carry a
# PATH-shadowing `gh` or a modified tool cache left by any earlier job, from any
# repo, and that would capture the token. The token is minted as late as
# possible (after fetch-metadata and the credential check, immediately before
# the merge steps) and reaches `gh` through step `env:` only. Nothing here runs
# a bare repository command: there is no checkout, so no git config or hook is
# read.
#
# Security: no checkout. PR code never executes here — fetch-metadata parses the
# PR server-side. Do not add a checkout step to "make it easier" to read files.

name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read # fetch-metadata lists PR commits; a read-only token 403s without this

jobs:
  auto-merge:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A secret this repo cannot reach resolves to the EMPTY STRING, never an
      # error, so the mint below fails as an opaque auth error that reads as
      # unrelated to its cause — the failure mode issue #178 documents. Name the
      # cause here rather than leaving it to be rediscovered from a stack trace.
      #
      # The cause is almost always repo visibility: org secrets at `private`
      # visibility cover private + internal repos and EXCLUDE public ones, in the
      # Actions and Dependabot stores alike. setup-deps refuses to render this
      # workflow into a public repo for exactly that reason — but that check runs
      # at RENDER time, and cannot see a repo that was internal when rendered and
      # went public afterwards. That repo keeps this workflow and finds out on its
      # next Dependabot PR, which may be weeks later.
      - name: Require the app credentials
        env:
          APP_CLIENT_ID: ${{ secrets.PLATFORM_WRITER_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.PLATFORM_WRITER_APP_PRIVATE_KEY }}
        run: |
          missing=
          [ -n "$APP_CLIENT_ID" ] || missing="$missing PLATFORM_WRITER_APP_CLIENT_ID"
          [ -n "$APP_KEY" ]       || missing="$missing PLATFORM_WRITER_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing Dependabot secret(s):$missing — org secrets are private-visibility and do not reach public repositories. If this repo has gone public, this workflow should be REMOVED rather than re-credentialed (Sassy-Dog/skills#178)."
            exit 1
          fi
          echo "App credentials present."

      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PLATFORM_WRITER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLATFORM_WRITER_APP_PRIVATE_KEY }}

# {{IF:MERGE_QUEUE}}
      # Merge-queue repos: plain `--auto`, NO method flag and NO --delete-branch.
      # Either one silently prevents queue entry or hard-errors. The queue runs
      # the required checks in the merge_group and ejects anything that goes red,
      # so nothing merges unverified.
      - name: Enqueue minor/patch
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch' }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto "$PR_URL"
# {{ENDIF}}
# {{IF:DIRECT_MERGE}}
      # Direct-merge repos: --auto --squash waits for the required checks, then
      # squash-merges. Requires "Allow auto-merge" enabled on the repo AND at
      # least one required status check — without a required check, --auto
      # merges immediately and the gate is imaginary.
      - name: Auto-merge minor/patch once checks pass
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch' }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
# {{ENDIF}}

      # The exact complement of the merge condition above, so every PR either
      # merges or is held with a reason — never silently neither.
      - name: Hold anything that is not an explicit minor/patch
        if: ${{ steps.meta.outputs.update-type != 'version-update:semver-minor' && steps.meta.outputs.update-type != 'version-update:semver-patch' }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          gh pr comment "$PR_URL" --body \
            "dependabot-auto-merge: **held for a human** (update-type: ${UPDATE_TYPE:-unknown}). Only an explicit semver-minor or semver-patch auto-merges; a green build does not prove a major is safe, and an unclassified bump is not known to be minor. Review, then merge manually."
