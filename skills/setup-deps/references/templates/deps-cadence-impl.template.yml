# TEMPLATE: deps-cadence-impl · version 1
# Rendered by sassy-dog:setup-deps through scripts/render-cadence.sh, never by
# hand. The renderer implements the same three rules as every template here
# (drop this header, keep or delete each # {{IF:FLAG}} block, substitute each
# {{TOKEN}}), and derives every fact below from the repo:
#   {{RUNNER}}            runs-on. Default [self-hosted, linux, sassy-dog], the
#                         same default as the other setup-deps workflows.
#   {{LANES}}             space-separated <ecosystem>:<directory> pairs, from the
#                         SAME detection that renders dependabot.yml's lanes
#                         (lib-ecosystems.sh). A lane is rendered only when its
#                         directory holds that ecosystem's tracked lockfile.
#   {{NO_REFRESH}}        detected ecosystems with no refresh command here
#                         (gradle, nuget, docker, github-actions, cocoapods, …),
#                         listed so the absence reads as deliberate.
#   {{NOT_REFRESHED}}     refreshable lanes skipped because their directory
#                         tracks no lockfile, with the reason.
#   {{BUN_VERSION_FILE}} / {{BUN_VERSION}}, {{NODE_VERSION_FILE}} /
#   {{NODE_VERSION}}      the pin CI uses, as a file setup-* reads at run time or
#                         as CI's literal. Exactly one arm of each pair renders.
#   {{FLUTTER_PIN_FILE}}  .fvmrc, .fvm/fvm_config.json or a pubspec.yaml with
#                         an exact environment.flutter; read at run time.
#   {{RUST_PIN_FILE}}     rust-toolchain(.toml); read at run time.
# A lane whose toolchain has no exact pin REFUSES the render: a floating
# toolchain writes a lockfile CI's toolchain may reject, and that failure would
# otherwise surface at 09:00 on the 1st instead of at render time.
# Delete this header block from the rendered output; keep the generated-by line.
---
# generated-by: sassy-dog:setup-deps | template: deps-cadence-impl | template-version: 1
#
# Monthly lockfile refresh, called by deps-cadence.yml (the thin trigger).
#
# Lanes refreshed here: {{LANES}}
# No refresh command here, deliberately (Dependabot or a lockfile-sync workflow
# keeps these current): {{NO_REFRESH}}
# Not refreshed (no tracked lockfile in the lane): {{NOT_REFRESHED}}
#
# Each lane refreshes WITHIN its declared ranges (bun update, npm update,
# flutter pub upgrade, cargo update). An exact pin never moves here; the bun and
# npm lanes REPORT stale exact pins in the PR body and the job summary instead,
# and still report them in a month where nothing else moved. pub and cargo
# exact pins are not reported in this version.
#
# Rules this workflow keeps, each pinned by a setup-deps gate:
#   - ONE credential: a GitHub App installation token. No PAT and no
#     GITHUB_TOKEN fallback. A PR opened with GITHUB_TOKEN never fires CI, so a
#     fallback hides a broken setup behind a green run. No App secret fails the
#     run; it never warns and carries on.
#   - A failed refresh FAILS THE JOB. A skipped lane is a silent stale month.
#   - Only the lanes' own manifest and lockfile paths are staged.
#   - No --label: a label the repo lacks makes `gh pr create` fail.
#   - Plain `gh pr merge --auto`, no method flag: the merge queue picks the
#     method, and a method flag stops the PR entering the queue.
#
# The App credentials come from the ACTIONS secrets store (org-level, private
# visibility). This is a scheduled run, not a Dependabot-triggered one, so the
# Actions store is the visible one. Org secrets at private visibility do not
# reach a public repo, which is why setup-deps never renders this there.
#
# Re-render with sassy-dog:setup-deps instead of editing; edits to an owned
# file are overwritten on the next refresh.

name: Dependency cadence (impl)

on:
  workflow_call:
    secrets:
      PLATFORM_WRITER_APP_CLIENT_ID:
        required: true
      PLATFORM_WRITER_APP_PRIVATE_KEY:
        required: true

# The built-in token only reads the checkout. Every write (push, PR, enqueue)
# uses the App token minted below.
permissions:
  contents: read

jobs:
  refresh:
    name: Refresh lockfiles
    runs-on: {{RUNNER}}
    # The App token is minted first and lives one hour. Keep this timeout
    # under that, or a slow refresh would reach the push with an expired token.
    timeout-minutes: 45
    env:
      LANES: "{{LANES}}"
    steps:
      # A secret this repo cannot reach resolves to the EMPTY STRING, never an
      # error, so the mint below would fail as an opaque auth error. Name the
      # cause here and fail. There is no fallback credential by design.
      - name: Require the app credentials
        env:
          APP_CLIENT_ID: ${{ secrets.PLATFORM_WRITER_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.PLATFORM_WRITER_APP_PRIVATE_KEY }}
        run: |
          missing=
          [ -n "$APP_CLIENT_ID" ] || missing="$missing PLATFORM_WRITER_APP_CLIENT_ID"
          [ -n "$APP_KEY" ]       || missing="$missing PLATFORM_WRITER_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing Actions secret(s):$missing. Org secrets are private-visibility and do not reach public repositories. This workflow has no fallback credential on purpose: a PR opened without the App token never fires CI."
            exit 1
          fi
          echo "App credentials present."

      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PLATFORM_WRITER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLATFORM_WRITER_APP_PRIVATE_KEY }}

      # Run from the default branch only, and never stack a second branch in
      # one month: a re-dispatch after this month's PR opened exits 0 with a
      # notice naming that PR.
      - name: Plan this month's run
        id: plan
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          if [ "$GITHUB_REF_NAME" != "$default_branch" ]; then
            echo "::error::Run this from the default branch ($default_branch), not $GITHUB_REF_NAME. The refresh starts from the checked-out tree and the PR targets $default_branch."
            exit 1
          fi
          month="$(date -u +%Y-%m)"
          branch="chore/deps-${month}"
          {
            echo "default_branch=$default_branch"
            echo "month=$month"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
          found="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/${branch}" \
            --jq "[.[] | select(.ref == \"refs/heads/${branch}\")] | length")"
          if [ "$found" != "0" ]; then
            pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json url --jq '.[0].url // empty')"
            echo "::notice::Branch $branch already exists (open PR: ${pr:-none}). This month's refresh has already run, so this run stops here."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # No token: and persist-credentials: false. Nothing between checkout and
      # the push needs write, so no credential sits in .git/config while the
      # refresh runs the repo's package managers. The push authenticates from
      # its own step env:.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.plan.outputs.skip != 'true' }}
        with:
          persist-credentials: false

      # Toolchains: each is set up only when a lane needs it, and always from
      # the repo's own pin. A different bun, npm, Flutter or cargo can write a
      # different lockfile from the one CI then validates.
# {{IF:BUN_PIN_FILE}}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ steps.plan.outputs.skip != 'true' }}
        with:
          bun-version-file: '{{BUN_VERSION_FILE}}'

# {{ENDIF}}
# {{IF:BUN_PIN_LITERAL}}
      # CI pins bun as a literal, so this copy of it moves only on a re-render.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ steps.plan.outputs.skip != 'true' }}
        with:
          bun-version: '{{BUN_VERSION}}'

# {{ENDIF}}
# {{IF:NODE_PIN_FILE}}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        if: ${{ steps.plan.outputs.skip != 'true' }}
        with:
          node-version-file: '{{NODE_VERSION_FILE}}'

# {{ENDIF}}
# {{IF:NODE_PIN_LITERAL}}
      # CI pins node as a literal, so this copy of it moves only on a re-render.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        if: ${{ steps.plan.outputs.skip != 'true' }}
        with:
          node-version: '{{NODE_VERSION}}'

# {{ENDIF}}
# {{IF:FLUTTER}}
      # Read at run time so a pin bump in the repo needs no re-render. An
      # unreadable or floating value fails here rather than installing a
      # Flutter the repo did not choose.
      - name: Read the Flutter pin
        id: flutter_pin
        if: ${{ steps.plan.outputs.skip != 'true' }}
        env:
          PIN_FILE: '{{FLUTTER_PIN_FILE}}'
        run: |
          set -euo pipefail
          case "$PIN_FILE" in
            *.fvmrc)           v="$(jq -r '.flutter // empty' "$PIN_FILE")" ;;
            *fvm_config.json)  v="$(jq -r '.flutterSdkVersion // empty' "$PIN_FILE")" ;;
            *pubspec.yaml)
              v="$(awk '
                /^[^[:space:]#]/ { inenv = ($0 ~ /^environment:/); next }
                inenv && /^[[:space:]]+flutter:/ {
                  sub(/^[[:space:]]+flutter:[[:space:]]*/, ""); sub(/[[:space:]]+#.*$/, "")
                  gsub(/["\047[:space:]]/, ""); print; exit
                }' "$PIN_FILE")" ;;
            *) echo "::error::Unrecognised Flutter pin file: $PIN_FILE"; exit 1 ;;
          esac
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$PIN_FILE does not pin an exact Flutter version (read: '${v}'). Pin one, then re-run."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        if: ${{ steps.plan.outputs.skip != 'true' }}
        with:
          flutter-version: ${{ steps.flutter_pin.outputs.version }}

# {{ENDIF}}
# {{IF:RUST}}
      # Read at run time, like the Flutter pin. rustup would honour the file in
      # its own directory anyway; installing it explicitly makes the toolchain
      # present on a runner that has never seen it.
      - name: Read the Rust toolchain pin
        id: rust_pin
        if: ${{ steps.plan.outputs.skip != 'true' }}
        env:
          PIN_FILE: '{{RUST_PIN_FILE}}'
        run: |
          set -euo pipefail
          # `channel = "…"` in either file form; otherwise the legacy one-line
          # rust-toolchain file's first non-comment line.
          v="$(awk '
            /^[[:space:]]*channel[[:space:]]*=/ {
              sub(/^[^=]*=[[:space:]]*/, ""); sub(/[[:space:]]+#.*$/, ""); gsub(/["\047[:space:]]/, "")
              print; done = 1; exit
            }
            first == "" && /[^[:space:]]/ && !/^[[:space:]]*[#\[]/ && !/=/ { first = $0; gsub(/[[:space:]]/, "", first) }
            END { if (!done && first != "") print first }
          ' "$PIN_FILE")"
          if ! [[ "$v" =~ ^([0-9]+\.[0-9]+\.[0-9]+|(nightly|beta)-[0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]; then
            echo "::error::$PIN_FILE does not pin an exact Rust toolchain (read: '${v}'). Pin one, then re-run."
            exit 1
          fi
          echo "toolchain=$v" >> "$GITHUB_OUTPUT"

      # Pinned to a commit of the action; the toolchain input below, not the
      # action's ref, decides which Rust is installed.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        if: ${{ steps.plan.outputs.skip != 'true' }}
        with:
          toolchain: ${{ steps.rust_pin.outputs.toolchain }}

# {{ENDIF}}
      # One loop over LANES, one case arm per ecosystem. `set -e` makes any
      # failed refresh fail the job: a lane is never skipped and carried past.
      # Each arm also names the ONLY paths that lane may stage, and only
      # tracked files that the refresh modified are recorded. Untracked output
      # and files outside the lanes are never committed.
      - name: Refresh each lane within its declared ranges
        id: refresh
        if: ${{ steps.plan.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/deps-cadence"
          mkdir -p "$work"
          : > "$work/stage.z"
          : > "$work/lanes.md"
          for lane in $LANES; do
            eco="${lane%%:*}"
            dir="${lane#*:}"
            rel="${dir#/}"
            prefix="${rel:+$rel/}"
            echo "::group::$eco lane $dir"
            case "$eco" in
              bun)
                (cd "./$rel" && bun update --ignore-scripts)
                set -- ":(glob)${prefix}**/package.json" ":(literal)${prefix}bun.lock" ;;
              npm)
                (cd "./$rel" && npm update --ignore-scripts)
                set -- ":(literal)${prefix}package.json" ":(literal)${prefix}package-lock.json" ;;
              pub)
                (cd "./$rel" && flutter pub upgrade)
                set -- ":(literal)${prefix}pubspec.yaml" ":(literal)${prefix}pubspec.lock" ;;
              cargo)
                (cd "./$rel" && cargo update)
                set -- ":(literal)${prefix}Cargo.lock" ;;
              *)
                echo "::error::LANES names '$eco', which has no refresh command here. Re-render with sassy-dog:setup-deps."
                exit 1 ;;
            esac
            echo "::endgroup::"
            git ls-files -m -z -- "$@" >> "$work/stage.z"
            delta="$(git diff --shortstat -- "$@")"
            echo "- \`$lane\`: ${delta:-no change}" >> "$work/lanes.md"
          done
          others="$(git ls-files -m | grep -vxF -f <(tr '\0' '\n' < "$work/stage.z") || true)"
          if [ -n "$others" ]; then
            echo "::warning::The refresh modified files outside the lanes' manifests and lockfiles. They are NOT committed: $(echo "$others" | tr '\n' ' ')"
          fi

      # Exact pins sit outside every declared range, so the refresh above can
      # never move them, and a month where nothing moved would otherwise read
      # as healthy while a pin rots. Reported, never bumped: an exact pin is a
      # human decision, but an INVISIBLE stale one is a bug. A manifest the tool
      # could not evaluate is reported as such, never as current.
      - name: Report exact pins (bun and npm lanes)
        if: ${{ steps.plan.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || { echo "::error::jq is required for the exact-pin report."; exit 1; }
          work="$RUNNER_TEMP/deps-cadence"
          mkdir -p "$work"
          report="$work/pins.md"

          # `bun outdated` has no --json, so its table IS the interface:
          #   | Package           | Current | Update | Latest | (Workspace) |
          # emitted as "name<TAB>latest". The (dev) suffix is a rendering
          # artifact, not part of the name. With colour on, bun draws the
          # columns with U+2502 and wraps cells in ANSI codes, so both are
          # normalised first; an unrecognised table must parse to NOTHING,
          # which the caller reports as "could not evaluate", never "current".
          parse_bun_outdated() {
            LC_ALL=C sed 's/\x1b\[[0-9;]*m//g; s/\xe2\x94\x82/|/g' \
            | awk -F'|' 'NF>=6 {
                for (i = 2; i <= 5; i++) gsub(/^[ \t]+|[ \t]+$/, "", $i)
                sub(/ \(dev\)$/, "", $2)
                if ($2 != "Package" && $2 !~ /^-+$/ && $5 != "") print $2"\t"$5
              }'
          }
          # `npm outdated --json`: {"name": {"latest": ...}}, or an array of
          # those per name when a workspace lists it twice.
          parse_npm_outdated() {
            jq -r 'to_entries[] | (.value | if type == "array" then .[0] else . end) as $v
                   | select($v.latest != null) | "\(.key)\t\($v.latest)"'
          }
          # An exact pin is a whole semver with no range operator; "1.x" and
          # "^1.2.3" are ranges the refresh can move.
          exact_pins() {
            jq -r '((.dependencies // {}) + (.devDependencies // {})) | to_entries[]
                   | select(.value | type == "string")
                   | select(.value | test("^=?v?[0-9]+\\.[0-9]+\\.[0-9]+([-+][0-9A-Za-z.+-]*)?$"))
                   | "\(.key)\t\(.value)"' "$1"
          }

          behind=""
          unevaluated=""
          checked=0
          for lane in $LANES; do
            eco="${lane%%:*}"
            dir="${lane#*:}"
            case "$eco" in bun|npm) ;; *) continue ;; esac
            rel="${dir#/}"
            # Every tracked package.json in the lane, minus any that sits in a
            # DEEPER lane's directory (that lane reports it).
            while IFS= read -r manifest; do
              mdir="$(dirname "$manifest")"
              nested=0
              for other in $LANES; do
                odir="${other#*:}"
                odir="${odir#/}"
                if [ -z "$odir" ] || [ "$odir" = "$rel" ]; then continue; fi
                case "$odir/" in "${rel:+$rel/}"*) ;; *) continue ;; esac
                case "$mdir/" in "$odir"/*) nested=1 ;; esac
              done
              [ "$nested" -eq 0 ] || continue
              pins="$(exact_pins "$manifest")" || { unevaluated+="$manifest (not valid JSON)"$'\n'; continue; }
              [ -n "$pins" ] || continue
              if [ "$eco" = "bun" ]; then
                if ! out="$(cd "./$mdir" && NO_COLOR=1 bun outdated 2>&1)"; then
                  unevaluated+="$manifest (bun outdated failed: $(echo "$out" | tail -n1))"$'\n'; continue
                fi
                latest="$(parse_bun_outdated <<<"$out")"
                if [ -z "$latest" ] && grep -qE '(^|[^A-Za-z])Package([^A-Za-z]|$)' <<<"$out"; then
                  unevaluated+="$manifest (bun outdated table not recognised)"$'\n'; continue
                fi
              else
                # npm outdated exits 1 whenever something IS outdated, so its
                # status says nothing; unparseable output is the failure.
                out="$(cd "./$mdir" && npm outdated --json 2>/dev/null)" || true
                [ -n "$out" ] || out='{}'
                if ! latest="$(parse_npm_outdated <<<"$out" 2>/dev/null)"; then
                  unevaluated+="$manifest (npm outdated output not recognised)"$'\n'; continue
                fi
              fi
              # Counted only once the tool answered: a manifest it could not
              # evaluate must never count towards "nothing is behind".
              checked=$((checked + 1))
              while IFS=$'\t' read -r name pinned; do
                [ -n "$name" ] || continue
                newest="$(awk -F'\t' -v n="$name" '$1 == n {print $2; exit}' <<<"$latest")"
                bare="${pinned#=}"
                bare="${bare#v}"
                if [ -n "$newest" ] && [ "$newest" != "$bare" ]; then
                  behind+="| \`$manifest\` | \`$name\` | $pinned | $newest |"$'\n'
                  echo "::warning file=$manifest::Exact pin $name@$pinned is behind $newest; the monthly refresh can never move it."
                fi
              done <<<"$pins"
            done < <(git ls-files -- "${rel:-.}" | grep -E '(^|/)package\.json$' || true)
          done

          {
            echo "### Exact pins (bun and npm lanes)"
            echo
            echo "A refresh moves nothing outside a declared range, so an exact pin never moves here. Bump a stale one by hand, or loosen it to a range. Check the Security tab first: a stale pin is how advisories accumulate unseen."
            echo
            if [ -n "$behind" ]; then
              echo "| Manifest | Package | Pinned | Latest |"
              echo "|---|---|---|---|"
              printf '%s' "$behind"
            elif [ "$checked" -gt 0 ]; then
              echo "No exact pin is behind its latest release in the $checked manifest(s) evaluated."
            elif [ -z "$unevaluated" ]; then
              echo "No bun or npm lane declares an exact pin."
            fi
            if [ -n "$unevaluated" ]; then
              echo
              echo "**Could not evaluate** (not the same as current):"
              printf '%s' "$unevaluated" | sed 's/^/- /'
            fi
            echo
            echo "pub and cargo exact pins are not reported in this version."
          } > "$report"
          if [ -n "$unevaluated" ]; then
            echo "::warning::Some manifests could not be checked for stale exact pins; see the job summary."
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Open the refresh PR and enqueue it
        if: ${{ steps.plan.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          MONTH: ${{ steps.plan.outputs.month }}
          DEFAULT_BRANCH: ${{ steps.plan.outputs.default_branch }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/deps-cadence"
          if [ ! -s "$work/stage.z" ]; then
            echo "::notice::Nothing moved within declared ranges in any lane ($LANES), so no PR. The exact-pin report is in the job summary."
            exit 0
          fi
          title="chore(deps): monthly lockfile refresh ${MONTH}"
          bot_id="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add --pathspec-from-file="$work/stage.z" --pathspec-file-nul
          if git diff --cached --quiet; then
            echo "::error::The refresh recorded changed lane files but nothing staged."
            exit 1
          fi
          git commit -q -m "$title" -m "Monthly refresh of each lane within its declared ranges, opened by deps-cadence (sassy-dog:setup-deps)."
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          {
            echo "Monthly lockfile refresh, opened by \`deps-cadence\` (rendered by \`sassy-dog:setup-deps\`). Each lane was refreshed within its declared ranges; exact pins never move here."
            echo
            echo "### Lockfile delta per lane"
            echo
            cat "$work/lanes.md"
            echo
            cat "$work/pins.md"
          } > "$work/body.md"
          url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$DEFAULT_BRANCH" --head "$BRANCH" \
            --title "$title" --body-file "$work/body.md")"
          echo "Opened $url"
          # Plain --auto: the merge queue runs the required checks and picks
          # the method. A method flag or --delete-branch keeps it out of the
          # queue.
          gh pr merge --auto "$url"
          echo "Enqueued: $url merges when the queue goes green."
