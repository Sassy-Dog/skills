# TEMPLATE: deps-cadence-impl · version 7
# Rendered by sassy-dog:setup-deps through scripts/render-cadence.sh, never by
# hand. The renderer implements the same three rules as every template here
# (drop this header, keep or delete each # {{IF:FLAG}} block, substitute each
# {{TOKEN}}), and derives every fact below from the repo:
#   {{LANES}}             space-separated <ecosystem>:<directory> pairs, from the
#                         SAME detection that renders dependabot.yml's lanes
#                         (lib-ecosystems.sh). A lane is rendered only when its
#                         directory holds that ecosystem's tracked lockfile.
#   {{NO_REFRESH}}        detected ecosystems with no refresh command here
#                         (gradle, nuget, docker, github-actions, cocoapods, …),
#                         listed so the absence reads as deliberate.
#   {{NOT_REFRESHED}}     refreshable lanes skipped because their directory
#                         tracks no lockfile, with the reason.
#   {{BUN_VERSION_FILE}} / {{BUN_VERSION}}, {{NODE_VERSION_FILE}} /
#   {{NODE_VERSION}}      the pin CI uses, as a file setup-* reads at run time or
#                         as CI's literal. Exactly one arm of each pair renders.
#   {{FLUTTER_PIN_FILE}}  .fvmrc, .fvm/fvm_config.json or a pubspec.yaml with
#                         an exact environment.flutter; read at run time.
#   {{RUST_PIN_FILE}}     rust-toolchain(.toml); read at run time.
#   {{IGNORE_RULES_AWK}}  the awk program of extract_ignore_rules (lib-ecosystems.sh),
#                         written at this token's indent: the single source the
#                         bare ignore: report parses .github/dependabot.yml with.
# A lane whose toolchain has no exact pin REFUSES the render: a floating
# toolchain writes a lockfile CI's toolchain may reject, and that failure would
# otherwise surface at 09:00 on the 1st instead of at render time.
#
# runs-on is NOT a fact (version 2). This job runs package-manager code and
# then holds the org-wide platform-writer App token, so it runs only on an
# ephemeral GitHub-hosted runner: a persistent shared runner can carry a
# PATH-shadowing git/gh/bun/cargo, a global gitconfig hook or credential helper,
# or a modified tool cache from any earlier job, and that would capture the
# token. Every toolchain here is installed by an action, so nothing needs the
# fleet. render-cadence.sh refuses --runner.
#
# THREE JOBS (version 3). Version 2 minted the token late but in the SAME job,
# on the SAME VM, as the package managers, and a process they started (or a
# poisoned tool cache) could outlive its step and read the token from
# /proc/*/environ, $RUNNER_TEMP or step files. Now:
#   plan     no repo code: the credential presence check and the month plan.
#   refresh  no secrets, contents: read: runs the package managers and the
#            exact-pin report, then uploads a patch of the lane files plus the
#            report as an artifact. Nothing it produces is trusted.
#   open-pr  a fresh VM that runs no package-manager or repo code: it checks
#            the patch against paths re-derived from LANES, applies it with
#            hooks off, and only then mints the App token, commits, pushes,
#            opens the PR and enqueues it.
# Version 7 (impl version, #539) closes three gaps in the holds report: empty
# `npm outdated --json` output is `Could not evaluate` (npm prints `{}` itself
# when nothing is outdated, so a `{}` default read a missing npm as current); a
# crate with several versions in Cargo.lock is compared at the version a
# workspace member's own dependency edge names (`resolve.nodes[].deps`), and is
# `Could not evaluate` when that edge does not name exactly one version.
# Version 6 adds the "Bare ignore: holds" report (#524): a third section, in its
# own step after the pub and cargo one, that lists each bare ignore: hold in
# .github/dependabot.yml (read at run time) whose resolved version is behind
# latest. The two exact-pin sections above it are unchanged.
# Version 5 only passes the hook-disabling `nohooks` to open-pr's one remaining
# bare git call (the `git ls-files -s` in the validator), so every git call in
# the job is uniform. The rendered file differs by that call and the version.
# An optional sibling, deps-cadence-codegen.yml (its own template), regenerates
# committed codegen on the PR this workflow opens; this file is unchanged by it.
# Delete this header block from the rendered output; keep the generated-by line.
---
# generated-by: sassy-dog:setup-deps | template: deps-cadence-impl | template-version: 7
#
# Monthly lockfile refresh, called by deps-cadence.yml (the thin trigger).
#
# Lanes refreshed here: {{LANES}}
# No refresh command here, deliberately (Dependabot or a lockfile-sync workflow
# keeps these current): {{NO_REFRESH}}
# Not refreshed (no tracked lockfile in the lane): {{NOT_REFRESHED}}
#
# Each lane refreshes WITHIN its declared ranges (bun update, npm update,
# flutter pub upgrade, cargo update). An exact pin never moves here; the bun and
# npm lanes REPORT stale exact pins in the PR body and the job summary instead,
# and still report them in a month where nothing else moved. pub and cargo lanes
# do the same in a second section of their own (version 4).
#
# Rules this workflow keeps, each pinned by a setup-deps gate:
#   - ONE credential: a GitHub App installation token. No PAT and no
#     GITHUB_TOKEN fallback. A PR opened with GITHUB_TOKEN never fires CI, so a
#     fallback hides a broken setup behind a green run. No App secret fails the
#     run; it never warns and carries on.
#   - A failed refresh FAILS THE JOB. A skipped lane is a silent stale month.
#   - Only the lanes' own manifest and lockfile paths are staged.
#   - No --label: a label the repo lacks makes `gh pr create` fail.
#   - Plain `gh pr merge --auto`, no method flag: the merge queue picks the
#     method, and a method flag stops the PR entering the queue.
#   - An EPHEMERAL GITHUB-HOSTED runner only. The secrets are referenced only
#     in the plan job's presence check and in open-pr, and the App token is
#     minted in open-pr, after the untrusted patch is validated and applied.
#     The package managers run in a job that never sees a secret.
#   - The refresh's patch is UNTRUSTED: open-pr rejects any path outside the
#     lanes' manifests and lockfiles, any create, delete, rename, copy or mode
#     change, any binary hunk, and any path that is not a tracked regular file
#     (a symlink or a submodule).
#   - The token never reaches argv or a git config file: the push reads it
#     from the environment through a one-shot credential helper, with system
#     and global git config ignored and hooks disabled.
#
# The App credentials come from the ACTIONS secrets store (org-level, private
# visibility). This is a scheduled run, not a Dependabot-triggered one, so the
# Actions store is the visible one. Org secrets at private visibility do not
# reach a public repo, which is why setup-deps never renders this there.
#
# Re-render with sassy-dog:setup-deps instead of editing; edits to an owned
# file are overwritten on the next refresh.

name: Dependency cadence (impl)

on:
  workflow_call:
    secrets:
      PLATFORM_WRITER_APP_CLIENT_ID:
        required: true
      PLATFORM_WRITER_APP_PRIVATE_KEY:
        required: true

# The built-in token only READS (the checkout, the default branch, this
# month's branch and PR). Every write (push, PR, enqueue) uses the App token
# minted in open-pr, so a fallback to the built-in token could not write
# anyway. Each job grants itself no more than this.
permissions:
  contents: read

jobs:
  # No checkout and no repo code: safe to hold the secret values for the
  # presence check, and a missing secret fails before the refresh spends time.
  plan:
    name: Plan this month's run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      month: ${{ steps.plan.outputs.month }}
      branch: ${{ steps.plan.outputs.branch }}
      default_branch: ${{ steps.plan.outputs.default_branch }}
    steps:
      # A secret this repo cannot reach resolves to the EMPTY STRING, never an
      # error, so the mint in open-pr would fail as an opaque auth error. Name
      # the cause here and fail FAST, before the refresh. There is no fallback
      # credential by design.
      - name: Require the app credentials
        env:
          APP_CLIENT_ID: ${{ secrets.PLATFORM_WRITER_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.PLATFORM_WRITER_APP_PRIVATE_KEY }}
        run: |
          missing=
          [ -n "$APP_CLIENT_ID" ] || missing="$missing PLATFORM_WRITER_APP_CLIENT_ID"
          [ -n "$APP_KEY" ]       || missing="$missing PLATFORM_WRITER_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing Actions secret(s):$missing. Org secrets are private-visibility and do not reach public repositories. This workflow has no fallback credential on purpose: a PR opened without the App token never fires CI."
            exit 1
          fi
          echo "App credentials present."

      # Run from the default branch only, and never stack a second branch in
      # one month: a re-dispatch after this month's PR opened exits 0 with a
      # notice naming that PR. Reads only, with the built-in read-only token.
      - name: Plan this month's run
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          if [ "$GITHUB_REF_NAME" != "$default_branch" ]; then
            echo "::error::Run this from the default branch ($default_branch), not $GITHUB_REF_NAME. The refresh starts from the checked-out tree and the PR targets $default_branch."
            exit 1
          fi
          month="$(date -u +%Y-%m)"
          branch="chore/deps-${month}"
          {
            echo "default_branch=$default_branch"
            echo "month=$month"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
          found="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/${branch}" \
            --jq "[.[] | select(.ref == \"refs/heads/${branch}\")] | length")"
          if [ "$found" != "0" ]; then
            pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json url --jq '.[0].url // empty')"
            echo "::notice::Branch $branch already exists (open PR: ${pr:-none}). This month's refresh has already run, so this run stops here."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # Runs the repo's package managers. It references NO secret and can only
  # read: everything it hands on (the patch, the reports) is treated as
  # untrusted by open-pr.
  refresh:
    name: Refresh lockfiles
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' }}
    # Ephemeral and GitHub-hosted, never the self-hosted fleet: see the rules
    # above. Flutter, Rust, bun and node all install through actions here.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    env:
      LANES: "{{LANES}}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Toolchains: each is set up only when a lane needs it, and always from
      # the repo's own pin. A different bun, npm, Flutter or cargo can write a
      # different lockfile from the one CI then validates.
# {{IF:BUN_PIN_FILE}}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '{{BUN_VERSION_FILE}}'

# {{ENDIF}}
# {{IF:BUN_PIN_LITERAL}}
      # CI pins bun as a literal, so this copy of it moves only on a re-render.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '{{BUN_VERSION}}'

# {{ENDIF}}
# {{IF:NODE_PIN_FILE}}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: '{{NODE_VERSION_FILE}}'

# {{ENDIF}}
# {{IF:NODE_PIN_LITERAL}}
      # CI pins node as a literal, so this copy of it moves only on a re-render.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '{{NODE_VERSION}}'

# {{ENDIF}}
# {{IF:FLUTTER}}
      # Read at run time so a pin bump in the repo needs no re-render. An
      # unreadable or floating value fails here rather than installing a
      # Flutter the repo did not choose.
      - name: Read the Flutter pin
        id: flutter_pin
        env:
          PIN_FILE: '{{FLUTTER_PIN_FILE}}'
        run: |
          set -euo pipefail
          case "$PIN_FILE" in
            *.fvmrc)           v="$(jq -r '.flutter // empty' "$PIN_FILE")" ;;
            *fvm_config.json)  v="$(jq -r '.flutterSdkVersion // empty' "$PIN_FILE")" ;;
            *pubspec.yaml)
              v="$(awk '
                /^[^[:space:]#]/ { inenv = ($0 ~ /^environment:/); next }
                inenv && /^[[:space:]]+flutter:/ {
                  sub(/^[[:space:]]+flutter:[[:space:]]*/, ""); sub(/[[:space:]]+#.*$/, "")
                  gsub(/["\047[:space:]]/, ""); print; exit
                }' "$PIN_FILE")" ;;
            *) echo "::error::Unrecognised Flutter pin file: $PIN_FILE"; exit 1 ;;
          esac
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$PIN_FILE does not pin an exact Flutter version (read: '${v}'). Pin one, then re-run."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.flutter_pin.outputs.version }}

# {{ENDIF}}
# {{IF:RUST}}
      # Read at run time, like the Flutter pin. rustup would honour the file in
      # its own directory anyway; installing it explicitly makes the toolchain
      # present on a runner that has never seen it.
      - name: Read the Rust toolchain pin
        id: rust_pin
        env:
          PIN_FILE: '{{RUST_PIN_FILE}}'
        run: |
          set -euo pipefail
          # `channel = "…"` in either file form; otherwise the legacy one-line
          # rust-toolchain file's first non-comment line.
          v="$(awk '
            /^[[:space:]]*channel[[:space:]]*=/ {
              sub(/^[^=]*=[[:space:]]*/, ""); sub(/[[:space:]]+#.*$/, ""); gsub(/["\047[:space:]]/, "")
              print; done = 1; exit
            }
            first == "" && /[^[:space:]]/ && !/^[[:space:]]*[#\[]/ && !/=/ { first = $0; gsub(/[[:space:]]/, "", first) }
            END { if (!done && first != "") print first }
          ' "$PIN_FILE")"
          if ! [[ "$v" =~ ^([0-9]+\.[0-9]+\.[0-9]+|(nightly|beta)-[0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]; then
            echo "::error::$PIN_FILE does not pin an exact Rust toolchain (read: '${v}'). Pin one, then re-run."
            exit 1
          fi
          echo "toolchain=$v" >> "$GITHUB_OUTPUT"

      # Pinned to a commit of the action; the toolchain input below, not the
      # action's ref, decides which Rust is installed.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ steps.rust_pin.outputs.toolchain }}

# {{ENDIF}}
      # One loop over LANES, one case arm per ecosystem. `set -e` makes any
      # failed refresh fail the job: a lane is never skipped and carried past.
      # Each arm also names the ONLY paths that lane may stage, and only
      # tracked files that the refresh modified are recorded. Untracked output
      # and files outside the lanes are never committed.
      - name: Refresh each lane within its declared ranges
        id: refresh
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/deps-cadence"
          mkdir -p "$work"
          : > "$work/stage.z"
          : > "$work/lanes.md"
          for lane in $LANES; do
            eco="${lane%%:*}"
            dir="${lane#*:}"
            rel="${dir#/}"
            prefix="${rel:+$rel/}"
            echo "::group::$eco lane $dir"
            case "$eco" in
              bun)
                # A workspace root's plain `bun update` moves only the root's
                # own dependencies; --recursive moves every member too. It is
                # effective from bun 1.4.0 (1.2.20-1.3.14 accept the flag and
                # move no member), which render-cadence.sh enforces.
                if [ "$(jq -r 'if .workspaces then "yes" else "no" end' "./$rel/package.json")" = "yes" ]; then
                  (cd "./$rel" && bun update --recursive --ignore-scripts)
                else
                  (cd "./$rel" && bun update --ignore-scripts)
                fi
                set -- ":(glob)${prefix}**/package.json" ":(literal)${prefix}bun.lock" ;;
              npm)
                (cd "./$rel" && npm update --ignore-scripts)
                set -- ":(literal)${prefix}package.json" ":(literal)${prefix}package-lock.json" ;;
              pub)
                (cd "./$rel" && flutter pub upgrade)
                set -- ":(literal)${prefix}pubspec.yaml" ":(literal)${prefix}pubspec.lock" ;;
              cargo)
                (cd "./$rel" && cargo update)
                set -- ":(literal)${prefix}Cargo.lock" ;;
              *)
                echo "::error::LANES names '$eco', which has no refresh command here. Re-render with sassy-dog:setup-deps."
                exit 1 ;;
            esac
            echo "::endgroup::"
            git ls-files -m -z -- "$@" >> "$work/stage.z"
            delta="$(git diff --shortstat -- "$@")"
            echo "- \`$lane\`: ${delta:-no change}" >> "$work/lanes.md"
          done
          others="$(git ls-files -m | grep -vxF -f <(tr '\0' '\n' < "$work/stage.z") || true)"
          if [ -n "$others" ]; then
            echo "::warning::The refresh modified files outside the lanes' manifests and lockfiles. They are NOT committed: $(echo "$others" | tr '\n' ' ')"
          fi

      # Exact pins sit outside every declared range, so the refresh above can
      # never move them, and a month where nothing moved would otherwise read
      # as healthy while a pin rots. Reported, never bumped: an exact pin is a
      # human decision, but an INVISIBLE stale one is a bug. A manifest the tool
      # could not evaluate is reported as such, never as current.
      - name: Report exact pins (bun and npm lanes)
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || { echo "::error::jq is required for the exact-pin report."; exit 1; }
          work="$RUNNER_TEMP/deps-cadence"
          mkdir -p "$work"
          report="$work/pins.md"

          # `bun outdated` has no --json, so its table IS the interface:
          #   | Package           | Current | Update | Latest | (Workspace) |
          # emitted as "name<TAB>latest". The (dev) suffix is a rendering
          # artifact, not part of the name. With colour on, bun draws the
          # columns with U+2502 and wraps cells in ANSI codes, so both are
          # normalised first; an unrecognised table must parse to NOTHING,
          # which the caller reports as "could not evaluate", never "current".
          parse_bun_outdated() {
            LC_ALL=C sed 's/\x1b\[[0-9;]*m//g; s/\xe2\x94\x82/|/g' \
            | awk -F'|' 'NF>=6 {
                for (i = 2; i <= 5; i++) gsub(/^[ \t]+|[ \t]+$/, "", $i)
                sub(/ \(dev\)$/, "", $2)
                if ($2 != "Package" && $2 !~ /^-+$/ && $5 != "") print $2"\t"$5
              }'
          }
          # `npm outdated --json`: {"name": {"latest": ...}}, or an array of
          # those per name when a workspace lists it twice.
          parse_npm_outdated() {
            jq -r 'to_entries[] | (.value | if type == "array" then .[0] else . end) as $v
                   | select($v.latest != null) | "\(.key)\t\($v.latest)"'
          }
          # An exact pin is a whole semver with no range operator; "1.x" and
          # "^1.2.3" are ranges the refresh can move.
          exact_pins() {
            jq -r '((.dependencies // {}) + (.devDependencies // {})) | to_entries[]
                   | select(.value | type == "string")
                   | select(.value | test("^=?v?[0-9]+\\.[0-9]+\\.[0-9]+([-+][0-9A-Za-z.+-]*)?$"))
                   | "\(.key)\t\(.value)"' "$1"
          }

          behind=""
          unevaluated=""
          checked=0
          for lane in $LANES; do
            eco="${lane%%:*}"
            dir="${lane#*:}"
            case "$eco" in bun|npm) ;; *) continue ;; esac
            rel="${dir#/}"
            # Every tracked package.json in the lane, minus any that sits in a
            # DEEPER lane's directory (that lane reports it).
            while IFS= read -r manifest; do
              mdir="$(dirname "$manifest")"
              nested=0
              for other in $LANES; do
                odir="${other#*:}"
                odir="${odir#/}"
                if [ -z "$odir" ] || [ "$odir" = "$rel" ]; then continue; fi
                case "$odir/" in "${rel:+$rel/}"*) ;; *) continue ;; esac
                case "$mdir/" in "$odir"/*) nested=1 ;; esac
              done
              [ "$nested" -eq 0 ] || continue
              pins="$(exact_pins "$manifest")" || { unevaluated+="$manifest (not valid JSON)"$'\n'; continue; }
              [ -n "$pins" ] || continue
              if [ "$eco" = "bun" ]; then
                if ! out="$(cd "./$mdir" && NO_COLOR=1 bun outdated 2>&1)"; then
                  unevaluated+="$manifest (bun outdated failed: $(echo "$out" | tail -n1))"$'\n'; continue
                fi
                latest="$(parse_bun_outdated <<<"$out")"
                if [ -z "$latest" ] && grep -qE '(^|[^A-Za-z])Package([^A-Za-z]|$)' <<<"$out"; then
                  unevaluated+="$manifest (bun outdated table not recognised)"$'\n'; continue
                fi
              else
                # npm outdated exits 1 whenever something IS outdated, so its
                # status says nothing; unparseable output is the failure.
                out="$(cd "./$mdir" && npm outdated --json 2>/dev/null)" || true
                [ -n "$out" ] || out='{}'
                if ! latest="$(parse_npm_outdated <<<"$out" 2>/dev/null)"; then
                  unevaluated+="$manifest (npm outdated output not recognised)"$'\n'; continue
                fi
              fi
              # Counted only once the tool answered: a manifest it could not
              # evaluate must never count towards "nothing is behind".
              checked=$((checked + 1))
              while IFS=$'\t' read -r name pinned; do
                [ -n "$name" ] || continue
                newest="$(awk -F'\t' -v n="$name" '$1 == n {print $2; exit}' <<<"$latest")"
                bare="${pinned#=}"
                bare="${bare#v}"
                if [ -n "$newest" ] && [ "$newest" != "$bare" ]; then
                  behind+="| \`$manifest\` | \`$name\` | $pinned | $newest |"$'\n'
                  echo "::warning file=$manifest::Exact pin $name@$pinned is behind $newest; the monthly refresh can never move it."
                fi
              done <<<"$pins"
            done < <(git ls-files -- "${rel:-.}" | grep -E '(^|/)package\.json$' || true)
          done

          {
            echo "### Exact pins (bun and npm lanes)"
            echo
            echo "A refresh moves nothing outside a declared range, so an exact pin never moves here. Bump a stale one by hand, or loosen it to a range. Check the Security tab first: a stale pin is how advisories accumulate unseen."
            echo
            if [ -n "$behind" ]; then
              echo "| Manifest | Package | Pinned | Latest |"
              echo "|---|---|---|---|"
              printf '%s' "$behind"
            elif [ "$checked" -gt 0 ]; then
              echo "No exact pin is behind its latest release in the $checked manifest(s) evaluated."
            elif [ -z "$unevaluated" ]; then
              echo "No bun or npm lane declares an exact pin."
            fi
            if [ -n "$unevaluated" ]; then
              echo
              echo "**Could not evaluate** (not the same as current):"
              printf '%s' "$unevaluated" | sed 's/^/- /'
            fi
          } > "$report"
          if [ -n "$unevaluated" ]; then
            echo "::warning::Some manifests could not be checked for stale exact pins; see the job summary."
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      # The same report for pub and cargo lanes, in its OWN section so the bun
      # and npm section above stays byte-identical (a consumer reads it by its
      # literal strings). Same shape, same rule: reported, never bumped, and a
      # manifest the tools could not evaluate is never read as current.
      #   pub    an exact pin is a bare version under dependencies: or
      #          dev_dependencies: in pubspec.yaml ("1.2.3"; pub reads a bare
      #          version as that version only). The newest version comes from
      #          `flutter pub outdated --json` (.latest), which resolves against
      #          pub.dev with no credential, using the Flutter this job already
      #          installed from the repo's pin.
      #   cargo  an exact pin is a requirement of the form "=1.2.3" (a bare
      #          "1.2.3" is a caret range). `cargo metadata --no-deps` reads
      #          every workspace member's declared requirements offline and
      #          resolves `workspace = true` inheritance and renames, so no TOML
      #          is parsed by hand. The newest version comes from `cargo search`
      #          (the crates.io search API: no credential, and it works on every
      #          toolchain a repo may pin, which `cargo info` does not). Only
      #          crates.io dependencies are checked; a path, git or alternative-
      #          registry dependency has no crates.io latest to compare with.
      - name: Report exact pins (pub and cargo lanes)
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || { echo "::error::jq is required for the exact-pin report."; exit 1; }
          work="$RUNNER_TEMP/deps-cadence"
          mkdir -p "$work"
          report="$work/pins.md"
          section="$work/pins-pub-cargo.md"

          wanted=0
          for lane in $LANES; do
            case "${lane%%:*}" in pub|cargo) wanted=1 ;; esac
          done
          # No such lane: no section, so a bun- or npm-only repo's report is
          # exactly what it was before this step existed.
          [ "$wanted" -eq 1 ] || exit 0

          # `flutter pub outdated --json`: {"packages": [{"package": ...,
          # "latest": {"version": ...}}]}. A package with no latest is omitted.
          parse_pub_outdated() {
            jq -r '.packages[] | select(.latest.version != null) | "\(.package)\t\(.latest.version)"'
          }
          # Direct dependencies written as a bare whole version, optionally
          # quoted: "name: 1.2.3". A caret or any other range is not a pin.
          exact_pub_pins() {
            awk '
              /^[^[:space:]#]/ { sect = ($0 ~ /^(dependencies|dev_dependencies):/); next }
              sect && /^  [A-Za-z_][A-Za-z0-9_]*:[[:space:]]*["\047]?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]*)?["\047]?[[:space:]]*(#.*)?$/ {
                name = $0; sub(/^  /, "", name); sub(/:.*$/, "", name)
                v = $0; sub(/^[^:]*:[[:space:]]*/, "", v); sub(/[[:space:]]+#.*$/, "", v); gsub(/["\047[:space:]]/, "", v)
                print name "\t" v
              }' "$1"
          }
          # Exact crates.io requirements of every workspace member, as
          # "manifest<TAB>crate<TAB>=x.y.z".
          exact_cargo_pins() {
            jq -r '.packages[] | .manifest_path as $m | .dependencies[]
                   | select((.source // "") | test("crates\\.io-index"))
                   | select(.req | test("^=[0-9]+\\.[0-9]+\\.[0-9]+([-+][0-9A-Za-z.+-]*)?$"))
                   | "\($m)\t\(.name)\t\(.req)"'
          }
          # `cargo search` prints: name = "1.2.3"    # description
          # A failed search returns 1 with no output, whatever it printed, and
          # awk reads to the end of its input (no early exit, so cargo never
          # sees a closed pipe); the caller treats both as "could not evaluate".
          cargo_latest() {
            local res
            res="$(cargo search "$1" --limit 10 2>/dev/null)" || return 1
            awk -v n="$1" '$1 == n && $2 == "=" && !found { gsub(/"/, "", $3); print $3; found = 1 }' <<<"$res"
          }

          behind=""
          unevaluated=""
          checked=0
          seen=$'\n'
          for lane in $LANES; do
            eco="${lane%%:*}"
            dir="${lane#*:}"
            case "$eco" in pub|cargo) ;; *) continue ;; esac
            rel="${dir#/}"
            if [ "$eco" = "pub" ]; then
              manifest="${rel:+$rel/}pubspec.yaml"
              pins="$(exact_pub_pins "./$manifest")" || { unevaluated+="$manifest (not readable)"$'\n'; continue; }
              [ -n "$pins" ] || continue
              if ! out="$(cd "./$rel" && flutter pub outdated --json 2>/dev/null)" \
                  || ! latest="$(parse_pub_outdated <<<"$out" 2>/dev/null)"; then
                unevaluated+="$manifest (flutter pub outdated output not recognised)"$'\n'; continue
              fi
              # Counted only once the tool answered, as in the bun and npm report.
              checked=$((checked + 1))
              while IFS=$'\t' read -r name pinned; do
                [ -n "$name" ] || continue
                newest="$(awk -F'\t' -v n="$name" '$1 == n {print $2; exit}' <<<"$latest")"
                if [ -n "$newest" ] && [ "$newest" != "$pinned" ]; then
                  behind+="| \`$manifest\` | \`$name\` | $pinned | $newest |"$'\n'
                  echo "::warning file=$manifest::Exact pin $name@$pinned is behind $newest; the monthly refresh can never move it."
                fi
              done <<<"$pins"
            else
              if ! out="$(cd "./$rel" && cargo metadata --no-deps --format-version 1 2>/dev/null)" \
                  || ! pins="$(exact_cargo_pins <<<"$out" 2>/dev/null)"; then
                unevaluated+="${rel:+$rel/}Cargo.toml (cargo metadata output not recognised)"$'\n'; continue
              fi
              [ -n "$pins" ] || continue
              # A lane counts as evaluated only if every pin in it was looked up.
              lane_ok=1
              while IFS=$'\t' read -r mpath name pinned; do
                [ -n "$name" ] || continue
                manifest="${mpath#"$PWD"/}"
                case "$seen" in *$'\n'"$manifest $name"$'\n'*) continue ;; esac
                seen+="$manifest $name"$'\n'
                newest="$(cargo_latest "$name" || true)"
                if [ -z "$newest" ]; then
                  unevaluated+="$manifest ($name: no latest version from cargo search)"$'\n'; lane_ok=0; continue
                fi
                if [ "$newest" != "${pinned#=}" ]; then
                  behind+="| \`$manifest\` | \`$name\` | $pinned | $newest |"$'\n'
                  echo "::warning file=$manifest::Exact pin $name@$pinned is behind $newest; the monthly refresh can never move it."
                fi
              done <<<"$pins"
              if [ "$lane_ok" -eq 1 ]; then checked=$((checked + 1)); fi
            fi
          done

          {
            echo
            echo "### Exact pins (pub and cargo lanes)"
            echo
            echo "A refresh moves nothing outside a declared range, so an exact pin never moves here. Bump a stale one by hand, or loosen it to a range. Check the Security tab first: a stale pin is how advisories accumulate unseen."
            echo
            if [ -n "$behind" ]; then
              echo "| Manifest | Package | Pinned | Latest |"
              echo "|---|---|---|---|"
              printf '%s' "$behind"
            elif [ "$checked" -gt 0 ]; then
              echo "No exact pin is behind its latest release in the $checked manifest(s) evaluated."
            elif [ -z "$unevaluated" ]; then
              echo "No pub or cargo lane declares an exact pin."
            fi
            if [ -n "$unevaluated" ]; then
              echo
              echo "**Could not evaluate** (not the same as current):"
              printf '%s' "$unevaluated" | sed 's/^/- /'
            fi
          } > "$section"
          if [ -n "$unevaluated" ]; then
            echo "::warning::Some pub or cargo manifests could not be checked for stale exact pins; see the job summary."
          fi
          cat "$section" >> "$report"
          cat "$section" >> "$GITHUB_STEP_SUMMARY"

      # A BARE `ignore:` hold in .github/dependabot.yml (a dependency-name and
      # no update-types or versions) stops Dependabot moving that dependency at
      # all, and an exact pin is out of the refresh's reach too, so nothing else
      # reports when such a hold falls behind latest (#524). Reported, never
      # bumped. The holds are read at RUN time from the checked-out file, so a
      # hold added by hand is reported without a re-render; the parser is the
      # one extract_ignore_rules runs (lib-ecosystems.sh), injected at render
      # time and never copied by hand here. Latest versions come from the same
      # tools the two exact-pin reports use, run again here, and only for the lanes
      # this workflow refreshes: `bun outdated`, `npm outdated --json`,
      # `flutter pub outdated --json` (all three also give the resolved
      # version, the lane's lockfile) and, for cargo, `cargo metadata` (the
      # resolved version in Cargo.lock) plus `cargo search`. A hold in any other
      # ecosystem, in a directory no lane covers, or whose lookup failed is
      # listed as "Could not evaluate", never as current.
      # The rule for "current" is positive, not by omission. Those tools list
      # only dependencies that are behind, and `bun outdated` and `npm outdated`
      # cover only the package they run in, so a package they omit says nothing
      # unless the lane is KNOWN to contain it. A hold counts as checked only
      # when it is a direct dependency (dependencies, devDependencies,
      # optionalDependencies or peerDependencies) of a manifest under the lane,
      # and the lookup runs in the directory of each manifest that declares it,
      # the way the exact-pin report runs per manifest (so a workspace member's
      # dependency is looked up where it lives). Anything else (a typo, a
      # removed or transitive-only dependency) is "Could not evaluate (not a
      # dependency of this lane)". An npm or pub entry with no installed
      # version is not evaluable either, and npm's own failure (a JSON
      # {"error":…} envelope, which parses to no rows) is a failed lookup. bun
      # suffixes dev, peer and optional rows with "(dev)", "(peer)" or
      # "(optional)"; this step's parser strips all three (the exact-pin
      # report's frozen parser strips only "(dev)", the one it reads). A cargo
      # hold is checked against Cargo.lock.
      # Appended to the same pins.md (the PR body) and the job summary, whether
      # or not anything moved.
      - name: Report bare ignore holds
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || { echo "::error::jq is required for the bare ignore: report."; exit 1; }
          work="$RUNNER_TEMP/deps-cadence"
          mkdir -p "$work"
          report="$work/pins.md"
          section="$work/holds.md"
          cache="$work/holds-cache"
          rm -rf "${cache:?}"
          mkdir -p "$cache"
          # shellcheck disable=SC2016  # an awk program: deliberately not expanded
          ignore_rules_awk='
          {{IGNORE_RULES_AWK}}
          '

          # name<TAB>resolved<TAB>latest for every dependency the tool says is behind.
          parse_bun_outdated() {
            LC_ALL=C sed 's/\x1b\[[0-9;]*m//g; s/\xe2\x94\x82/|/g' \
            | awk -F'|' 'NF>=6 {
                for (i = 2; i <= 5; i++) gsub(/^[ \t]+|[ \t]+$/, "", $i)
                sub(/ \((dev|peer|optional)\)$/, "", $2)
                if ($2 != "Package" && $2 !~ /^-+$/ && $5 != "") print $2"\t"$3"\t"$5
              }'
          }
          parse_npm_outdated() {
            jq -r 'to_entries[] | (.value | if type == "array" then .[0] else . end) as $v
                   | select($v.latest != null) | "\(.key)\t\($v.current // "")\t\($v.latest)"'
          }
          parse_pub_outdated() {
            jq -r '.packages[] | select(.latest.version != null)
                   | select(.current.version == null or .latest.version != .current.version)
                   | "\(.package)\t\(.current.version // "")\t\(.latest.version)"'
          }
          cargo_latest() {
            local res
            res="$(cargo search "$1" --limit 10 2>/dev/null)" || return 1
            awk -v n="$1" '$1 == n && $2 == "=" && !found { gsub(/"/, "", $3); print $3; found = 1 }' <<<"$res"
          }

          # decl_scan <lane> — "$cache/<key>.decl": "<manifest dir><TAB><name>"
          # for every direct dependency of every manifest in the lane (bun and
          # npm: each tracked package.json, minus any that sits in a DEEPER
          # lane's directory, as the exact-pin report; pub: the lane's
          # pubspec.yaml). A hold absent from it is not known to be in the lane.
          decl_scan() {
            local lane="$1" eco dir rel key manifest mdir nested other odir
            eco="${lane%%:*}"; dir="${lane#*:}"; rel="${dir#/}"
            key="$(printf '%s' "$lane" | tr -c 'A-Za-z0-9' '_')"
            [ ! -e "$cache/$key.decl" ] || return 0
            : > "$cache/$key.decl"
            case "$eco" in
              bun|npm)
                while IFS= read -r manifest; do
                  mdir="$(dirname "$manifest")"
                  nested=0
                  for other in $LANES; do
                    odir="${other#*:}"
                    odir="${odir#/}"
                    if [ -z "$odir" ] || [ "$odir" = "$rel" ]; then continue; fi
                    case "$odir/" in "${rel:+$rel/}"*) ;; *) continue ;; esac
                    case "$mdir/" in "$odir"/*) nested=1 ;; esac
                  done
                  [ "$nested" -eq 0 ] || continue
                  jq -r --arg d "$mdir" '([.dependencies, .devDependencies, .optionalDependencies, .peerDependencies]
                       | map(select(type == "object")) | add // {}) | keys[] | "\($d)\t\(.)"' "$manifest" >> "$cache/$key.decl" 2>/dev/null || true
                done < <(git ls-files -- "${rel:-.}" | grep -E '(^|/)package\.json$' || true)
                ;;
              pub)
                manifest="${rel:+$rel/}pubspec.yaml"
                if [ -f "$manifest" ]; then
                  awk -v d="${rel:-.}" '
                    /^[^[:space:]#]/ { sect = ($0 ~ /^(dependencies|dev_dependencies):/); next }
                    sect && /^  [A-Za-z_][A-Za-z0-9_]*:/ { n = $0; sub(/^  /, "", n); sub(/:.*$/, "", n); print d "\t" n }' "$manifest" >> "$cache/$key.decl"
                fi ;;
            esac
          }

          # lookup <ecosystem> <directory> — fills "$cache/<key>.tsv" (name,
          # resolved, latest of each package that is behind), "$cache/<key>.meta"
          # (cargo: every resolved crate) or "$cache/<key>.err" (why not). Run
          # once per directory; a directory with no answer is never read as
          # current. Tools read /dev/null so they cannot eat the caller's loop.
          lookup() {
            local eco="$1" rel="$2" key out
            key="$(printf '%s' "$eco:$rel" | tr -c 'A-Za-z0-9' '_')"
            if [ -e "$cache/$key.tsv" ] || [ -e "$cache/$key.meta" ] || [ -e "$cache/$key.err" ]; then return 0; fi
            case "$eco" in
              bun)
                if ! out="$(cd "./$rel" && NO_COLOR=1 bun outdated 2>&1 </dev/null)"; then
                  echo "bun outdated failed: $(echo "$out" | tail -n1)" > "$cache/$key.err"; return 0
                fi
                parse_bun_outdated <<<"$out" > "$cache/$key.tsv"
                if [ ! -s "$cache/$key.tsv" ] && grep -qE '(^|[^A-Za-z])Package([^A-Za-z]|$)' <<<"$out"; then
                  echo "bun outdated table not recognised" > "$cache/$key.err"
                fi ;;
              npm)
                # npm outdated exits 1 whenever something IS outdated, so its
                # status says nothing; unparseable output is the failure.
                out="$(cd "./$rel" && npm outdated --json 2>/dev/null </dev/null)" || true
                if [ -z "$out" ]; then
                  echo "npm outdated produced no output" > "$cache/$key.err"; return 0
                fi
                # A registry, auth or install failure is a JSON {"error":{code,summary}}
                # envelope, which parses to no rows: it is a failed lookup, not "all current".
                if jq -e 'type == "object" and (.error | type == "object" and (has("code") or has("summary")) and (has("latest") | not))' <<<"$out" >/dev/null 2>&1; then
                  echo "npm outdated failed: $(jq -r '.error.summary // .error.code' <<<"$out" | head -n1)" > "$cache/$key.err"
                elif ! parse_npm_outdated <<<"$out" > "$cache/$key.tsv" 2>/dev/null; then
                  echo "npm outdated output not recognised" > "$cache/$key.err"
                fi ;;
              pub)
                if ! out="$(cd "./$rel" && flutter pub outdated --json 2>/dev/null </dev/null)" \
                    || ! parse_pub_outdated <<<"$out" > "$cache/$key.tsv" 2>/dev/null; then
                  echo "flutter pub outdated output not recognised" > "$cache/$key.err"
                fi ;;
              cargo)
                if ! out="$(cd "./$rel" && cargo metadata --format-version 1 2>/dev/null </dev/null)" \
                    || ! jq -r '.packages[] | "\(.name)\t\(.version)"' <<<"$out" > "$cache/$key.meta" 2>/dev/null \
                    || ! jq -r '(.workspace_members // []) as $ws
                        | (.packages | map({key: (.id // ""), value: .}) | from_entries) as $pk
                        | (.resolve.nodes // [])[] | select(. as $n | any($ws[]; . == $n.id))
                        | .deps[]? | $pk[.pkg // ""] | select(. != null) | "\(.name)\t\(.version)"' <<<"$out" > "$cache/$key.direct" 2>/dev/null; then
                  echo "cargo metadata output not recognised" > "$cache/$key.err"
                fi ;;
            esac
          }

          # The bare holds: "ecosystem<TAB>directory<TAB>package". One line per
          # (ecosystem, directory, package): an entry with several directories
          # emits the same rule once per directory under ONE rule id, so
          # nothing here may dedupe by rule id. A rule whose key is anything but
          # a lone dependency-name has an update-types or versions limit, so it
          # is not bare.
          holds=""
          unevaluated=""
          if [ -f .github/dependabot.yml ]; then
            if ! holds="$(awk "$ignore_rules_awk" .github/dependabot.yml \
                | awk -F'\t' '$4 ~ /^dependency-name:[^;]+$/ { print $1 "\t" $2 "\t" substr($4, 17) }' \
                | awk '!seen[$0]++')"; then
              holds=""; unevaluated+="- \`.github/dependabot.yml\`: Could not evaluate (its ignore: rules could not be read)"$'\n'
            fi
          fi

          behind=""
          checked=0
          total=0
          while IFS=$'\t' read -r eco dir name; do
            [ -n "$name" ] || continue
            total=$((total + 1))
            lane="$eco:$dir"
            case "$eco" in
              bun|npm|pub|cargo) ;;
              *) unevaluated+="- \`$lane\` \`$name\`: Could not evaluate (no lookup for $eco)"$'\n'; continue ;;
            esac
            case " $LANES " in
              *" $lane "*) ;;
              *) unevaluated+="- \`$lane\` \`$name\`: Could not evaluate (no $eco lane at $dir is refreshed here)"$'\n'; continue ;;
            esac
            case "$name" in
              *[\*\?\[]*) unevaluated+="- \`$lane\` \`$name\`: Could not evaluate (a name pattern, not a package)"$'\n'; continue ;;
            esac
            lrel="${dir#/}"
            lkey="$(printf '%s' "$lane" | tr -c 'A-Za-z0-9' '_')"
            if [ "$eco" = "cargo" ]; then
              lookup cargo "${lrel:-.}"
              key="$(printf '%s' "cargo:${lrel:-.}" | tr -c 'A-Za-z0-9' '_')"
              if [ -e "$cache/$key.err" ]; then
                unevaluated+="- \`$lane\` \`$name\`: Could not evaluate ($(cat "$cache/$key.err"))"$'\n'; continue
              fi
              versions="$(awk -F'\t' -v n="$name" '$1 == n {print $2}' "$cache/$key.meta" | sort -u)"
              if [ -z "$versions" ]; then
                unevaluated+="- \`$lane\` \`$name\`: Could not evaluate (not in Cargo.lock)"$'\n'; continue
              fi
              if [ "$(grep -c . <<<"$versions")" -eq 1 ]; then
                resolved="$versions"
              else
                # Several versions: only a workspace member's own dependency edge says which is held.
                resolved="$(awk -F'\t' -v n="$name" '$1 == n {print $2}' "$cache/$key.direct" | sort -u)"
                if [ "$(grep -c . <<<"$resolved")" -ne 1 ]; then
                  unevaluated+="- \`$lane\` \`$name\`: Could not evaluate (several versions of $name in Cargo.lock, none or more than one a direct dependency)"$'\n'; continue
                fi
              fi
              newest="$(cargo_latest "$name" || true)"
              if [ -z "$newest" ]; then
                unevaluated+="- \`$lane\` \`$name\`: Could not evaluate (no latest version from cargo search)"$'\n'; continue
              fi
              checked=$((checked + 1))
              if [ "$newest" != "$resolved" ]; then
                behind+="| \`$lane\` | \`$name\` | $resolved | $newest |"$'\n'
                echo "::warning::Bare ignore: hold on $name ($lane) is at $resolved; latest is $newest. Dependabot will not move it."
              fi
              continue
            fi
            # bun, npm, pub: the lane must be KNOWN to contain the package.
            decl_scan "$lane"
            mdirs="$(awk -F'\t' -v n="$name" '$2 == n {print $1}' "$cache/$lkey.decl" | sort -u)"
            if [ -z "$mdirs" ]; then
              unevaluated+="- \`$lane\` \`$name\`: Could not evaluate (not a dependency of this lane)"$'\n'; continue
            fi
            why=""
            rows=""
            while IFS= read -r mdir; do
              lookup "$eco" "$mdir"
              key="$(printf '%s' "$eco:$mdir" | tr -c 'A-Za-z0-9' '_')"
              if [ -e "$cache/$key.err" ]; then why="$(cat "$cache/$key.err")"; break; fi
              row="$(awk -F'\t' -v n="$name" '$1 == n {print; exit}' "$cache/$key.tsv")"
              [ -n "$row" ] || continue
              resolved="$(cut -f2 <<<"$row")"
              newest="$(cut -f3 <<<"$row")"
              if [ -z "$resolved" ]; then why="$eco reports no installed version of $name in $mdir"; break; fi
              if [ -n "$newest" ] && [ "$newest" != "$resolved" ]; then
                rows+="| \`$lane\` | \`$name\` | $resolved | $newest |"$'\n'
                echo "::warning::Bare ignore: hold on $name ($lane) is at $resolved; latest is $newest. Dependabot will not move it."
              fi
            done <<<"$mdirs"
            if [ -n "$why" ]; then
              unevaluated+="- \`$lane\` \`$name\`: Could not evaluate ($why)"$'\n'; continue
            fi
            # Counted only once the tool answered for every manifest that declares it.
            checked=$((checked + 1))
            behind+="$rows"
          done <<<"$holds"
          behind="$(printf '%s' "$behind" | awk '!seen[$0]++')"
          [ -z "$behind" ] || behind+=$'\n'

          {
            echo
            echo "### Bare ignore: holds"
            echo
            echo "A bare ignore: rule in .github/dependabot.yml stops Dependabot moving that dependency at all, and the refresh cannot move an exact pin either, so nothing else reports when the hold falls behind. Lift the hold, or bump the dependency by hand. Check the Security tab first: a held dependency is how advisories accumulate unseen."
            echo
            if [ -n "$behind" ]; then
              echo "| Lane | Package | Resolved | Latest |"
              echo "|---|---|---|---|"
              printf '%s' "$behind"
            elif [ "$checked" -gt 0 ]; then
              echo "No bare ignore: hold is behind its latest release among the $checked evaluated."
            elif [ "$total" -eq 0 ] && [ -z "$unevaluated" ]; then
              echo "No bare ignore: hold in .github/dependabot.yml."
            fi
            if [ -n "$unevaluated" ]; then
              echo
              printf '%s' "$unevaluated"
            fi
          } > "$section"
          if [ -n "$unevaluated" ]; then
            echo "::warning::Some bare ignore: holds could not be checked against latest; see the job summary."
          fi
          cat "$section" >> "$report"
          cat "$section" >> "$GITHUB_STEP_SUMMARY"

      # The ONLY thing that leaves this job: the lane files' diff, staged from
      # the recorded lane paths (the single `git add`), plus the two reports.
      # --no-renames, --no-ext-diff and --no-textconv keep the patch a plain
      # one; open-pr re-checks every line of it anyway.
      - name: Package the refresh as a patch
        id: patch
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/deps-cadence"
          out="$RUNNER_TEMP/deps-cadence-out"
          mkdir -p "$out"
          cp "$work/lanes.md" "$work/pins.md" "$out/"
          if [ ! -s "$work/stage.z" ]; then
            echo "::notice::Nothing moved within declared ranges in any lane ($LANES), so no PR. The exact-pin report is in the job summary."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add --pathspec-from-file="$work/stage.z" --pathspec-file-nul
          git diff --cached --binary --no-renames --no-ext-diff --no-textconv > "$out/cadence.patch"
          if [ ! -s "$out/cadence.patch" ]; then
            echo "::error::The refresh recorded changed lane files but produced an empty patch."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.patch.outputs.changed == 'true' }}
        with:
          name: deps-cadence
          path: ${{ runner.temp }}/deps-cadence-out/
          retention-days: 1
          if-no-files-found: error

  # A FRESH VM that runs no package-manager or repo code. The refresh job's
  # output is untrusted: the patch is checked against paths re-derived from
  # LANES and applied with hooks off BEFORE the App token exists.
  open-pr:
    name: Open the refresh PR
    needs: [plan, refresh]
    if: ${{ needs.plan.outputs.skip != 'true' && needs.refresh.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LANES: "{{LANES}}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deps-cadence
          path: ${{ runner.temp }}/deps-cadence-in

      # Every rule here is about the patch, not about who made it. The allowed
      # paths are re-derived from LANES with the SAME mapping as the refresh
      # step's case arms (test-deps-cadence-policy.sh executes both against the
      # same scratch repo), and git itself reports what the patch would do.
      - name: Validate and apply the refresh patch
        run: |
          set -euo pipefail
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          nohooks=(-c core.hooksPath=/dev/null -c core.fsmonitor=false)
          patch="$RUNNER_TEMP/deps-cadence-in/cadence.patch"
          reject() { echo "::error::Rejected the refresh patch: $1"; exit 1; }
          [ -s "$patch" ] || reject "the artifact holds no patch"

          allowed=""
          for lane in $LANES; do
            eco="${lane%%:*}"
            dir="${lane#*:}"
            rel="${dir#/}"
            [[ "$rel" =~ ^[A-Za-z0-9._/@+-]*$ ]] || reject "lane directory '$dir' is not a plain path"
            p="$(printf '%s' "$rel" | sed 's/[.+]/\\&/g')"
            p="${p:+$p/}"
            case "$eco" in
              bun)   allowed+="^${p}(.*/)?package\\.json\$|^${p}bun\\.lock\$|" ;;
              npm)   allowed+="^${p}package\\.json\$|^${p}package-lock\\.json\$|" ;;
              pub)   allowed+="^${p}pubspec\\.yaml\$|^${p}pubspec\\.lock\$|" ;;
              cargo) allowed+="^${p}Cargo\\.lock\$|" ;;
              *)     reject "LANES names '$eco', which has no lane files" ;;
            esac
          done
          allowed="${allowed%|}"
          [ -n "$allowed" ] || reject "LANES is empty"

          # git's own reading of the patch: any create, delete, rename, copy
          # or mode change shows up in --summary.
          summary="$(git "${nohooks[@]}" apply --summary -- "$patch")" || reject "git cannot parse it"
          [ -z "$summary" ] || reject "it creates, deletes, renames, copies or re-modes a file: $(echo "$summary" | tr '\n' ' ')"
          numstat="$(git "${nohooks[@]}" apply --numstat -- "$patch")" || reject "git cannot parse it"
          [ -n "$numstat" ] || reject "it changes nothing"
          while IFS=$'\t' read -r added _ path; do
            [ "$added" != "-" ] || reject "$path is a binary change; lane files are text"
            if ! [[ "$path" =~ ^[A-Za-z0-9._/@+-]+$ ]] || [[ "$path" == *..* ]]; then
              reject "unusual path '$path'"
            fi
            [[ "$path" =~ $allowed ]] || reject "$path is outside the lanes' manifests and lockfiles"
            mode="$(git "${nohooks[@]}" ls-files -s -- ":(literal)$path" | cut -d' ' -f1)"
            [ "$mode" = "100644" ] || [ "$mode" = "100755" ] \
              || reject "$path is not a tracked regular file (mode '${mode:-untracked}'; a symlink is 120000, a submodule 160000)"
          done <<<"$numstat"

          git "${nohooks[@]}" apply --index -- "$patch"
          # Belt and braces: what is staged, and only that, is lane files.
          while IFS= read -r path; do
            [[ "$path" =~ $allowed ]] || reject "after applying, $path is staged"
          done < <(git "${nohooks[@]}" diff --cached --name-only)
          if [ -n "$(git "${nohooks[@]}" status --porcelain --untracked-files=all | grep -v '^M  ' || true)" ]; then
            reject "after applying, the tree holds changes outside the index"
          fi

      # Minted only now: after the patch is validated and applied, on a VM that
      # never ran a package manager. The token lives one hour, far longer than
      # this job's timeout.
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PLATFORM_WRITER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLATFORM_WRITER_APP_PRIVATE_KEY }}

      - name: Open the refresh PR and enqueue it
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          BRANCH: ${{ needs.plan.outputs.branch }}
          MONTH: ${{ needs.plan.outputs.month }}
          DEFAULT_BRANCH: ${{ needs.plan.outputs.default_branch }}
        run: |
          set -euo pipefail
          # Git reads no system or global config here (no credential helper,
          # hooksPath, fsmonitor or insteadOf left behind by anything else), and
          # every git call that could run a hook or an fsmonitor program passes
          # nohooks: either would inherit GH_TOKEN from this step's environment.
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          nohooks=(-c core.hooksPath=/dev/null -c core.fsmonitor=false)
          work="$RUNNER_TEMP/deps-cadence-in"
          title="chore(deps): monthly lockfile refresh ${MONTH}"
          bot_id="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          # The validated patch is already in the index; nothing else is.
          git "${nohooks[@]}" switch -c "$BRANCH"
          if git "${nohooks[@]}" diff --cached --quiet; then
            echo "::error::The validated patch left nothing staged."
            exit 1
          fi
          git "${nohooks[@]}" commit -q -m "$title" -m "Monthly refresh of each lane within its declared ranges, opened by deps-cadence (sassy-dog:setup-deps)."
          # The token is never in argv or a URL: the single-quoted helper is
          # expanded by the shell git spawns, which reads GH_TOKEN from the
          # environment at run time. The empty helper first clears any other.
          # shellcheck disable=SC2016  # deliberately unexpanded: git's shell expands it
          git "${nohooks[@]}" -c credential.helper= \
            -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
            push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          {
            echo "Monthly lockfile refresh, opened by \`deps-cadence\` (rendered by \`sassy-dog:setup-deps\`). Each lane was refreshed within its declared ranges; exact pins never move here."
            echo
            echo "### Lockfile delta per lane"
            echo
            # Untrusted text from the refresh job: passed only as a file,
            # never through a shell, and capped below GitHub's body limit.
            head -c 20000 "$work/lanes.md"
            echo
            head -c 40000 "$work/pins.md"
          } > "$RUNNER_TEMP/body.md"
          url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$DEFAULT_BRANCH" --head "$BRANCH" \
            --title "$title" --body-file "$RUNNER_TEMP/body.md")"
          echo "Opened $url"
          # Plain --auto: the merge queue runs the required checks and picks
          # the method. A method flag or --delete-branch keeps it out of the
          # queue.
          gh pr merge --auto "$url"
          echo "Enqueued: $url merges when the queue goes green."
