---
# generated-by: sassy-dog:setup-deps | template: lockfile-sync-pod | template-version: 8
#
# Refresh pubspec.lock + Podfile.lock on Dependabot pub PRs — the macOS twin of
# dependabot-bun-lockfile.yml.
#
# THE PROBLEM: Dependabot updates pubspec.yaml but cannot run `pod install`, so
# any CI step verifying the pods are in sync correctly fails the PR. Dependabot
# has no cocoapods ecosystem at all, so this cannot be fixed by configuration —
# only by regenerating the lockfiles out of band, which is what this does.
#
# Same posture as the bun twin, for the same reasons:
#   - pull_request_target for write context; both jobs HARD-GATED to
#     dependabot[bot], so contributor PR code never reaches a write-capable
#     context.
#   - Push with a minted App token, not GITHUB_TOKEN: the push must re-trigger
#     CI and must not trip the bot-actor approval gate.
#   - Clean regeneration rather than chasing per-pod constraint prompts.
#   - PR head ref/repo via env:, never inlined into a run: shell.
#
# Security posture — do not weaken any of these:
#   1. Ephemeral GitHub-hosted runners, hard-coded (version 7, #529, part of
#      #515). The workflow runs Flutter and `pod install` on PR-authored
#      manifests, and the org-wide platform-writer App token (contents and
#      pull-request write on every installed repo) pushes the result. A
#      persistent shared self-hosted runner can carry a PATH-shadowing git or
#      pod, a global gitconfig with core.hooksPath, core.fsmonitor or a
#      credential helper, or a modified tool cache, left by any earlier job in
#      any repo. A GitHub-hosted VM starts clean and is destroyed after the job.
#      macOS is needed for exactly one job (CocoaPods); the job that holds the
#      token runs on ubuntu-latest.
#   2. The package managers and the token never share a VM. `pod install`
#      evaluates the Podfile and podspec Ruby, and `flutter pub get` runs
#      package hooks; a process either starts can outlive its step and read a
#      later-minted token from /proc/*/environ, $RUNNER_TEMP or step files. So
#      update-pod-lock runs both with no secret at all and uploads one
#      artifact, a patch of exactly two files. push-pod-lock runs no package
#      manager: it checks out, downloads the patch, validates it BEFORE the
#      mint (git's own --summary and --numstat: no create, delete, rename or
#      mode change, no binary hunk, every path one of the two lockfiles and
#      none twice, each a tracked regular file), applies it with hooks off, and
#      only then runs the presence step, the mint and the push.
#   3. The App token's lifetime on disk is bounded to the push step: checkout
#      sets persist-credentials: false and passes no token: at all, and the
#      push authenticates inline from its own env: (issue #232).
#   4. The push never puts the token in a URL or in argv. It goes through a
#      one-shot credential helper that reads GH_TOKEN from the environment (the
#      empty helper first clears any other), with system and global git config
#      ignored and every git call passing -c core.hooksPath=/dev/null
#      -c core.fsmonitor=false, since a hook or fsmonitor program would inherit
#      the push step's environment.
#   5. Both jobs check out the PR's head SHA, and the push is leased to it
#      (--force-with-lease on the head ref at that SHA): a branch that moved
#      between the jobs, or was deleted (a plain push would recreate it), fails
#      closed instead of being overwritten or resurrected.
#   6. No actions/cache, and no `cache:` on the Flutter action (it saves through
#      actions/cache). Under pull_request_target a save lands in the default-
#      branch cache scope, built from an install of the PR head's manifests, so
#      a poisoned one could seed a cache the base branch's own workflows
#      restore. Every run is a cold install.
#
name: Dependabot pod lockfile sync

on:
  pull_request_target:
    paths:
      - '{{APP_DIR}}/pubspec.yaml'

permissions:
  contents: read

# One run per PR at a time; a second push to the same Dependabot branch queues
# behind the run that is pushing the lockfiles rather than racing it. Both jobs
# check out the head SHA the event carried, and the push is leased to it.
concurrency:
  group: dependabot-pod-lock-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # JOB 1 — runs Flutter and CocoaPods, holds NO secret. Its only output is a
  # patch of the two lockfiles, uploaded as an artifact. The PR-authored
  # manifests, the Podfile and the package managers live and die on this VM;
  # the App token never exists here. The only job that needs macOS.
  update-pod-lock:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    env:
      FLUTTER_VERSION: '{{FLUTTER_VERSION}}'
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      # Git reads no system or global config in any step: nothing left on the
      # VM can inject a hook path, fsmonitor program or credential helper.
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: /dev/null
    steps:
      # No token: and persist-credentials: false. actions/checkout defaults
      # persist-credentials to true, which writes whatever token it was given
      # into .git/config for the rest of the job — in a workspace that holds
      # PR-authored content, and one where `pod install` evaluates podspec Ruby.
      # Dependabot pushes its head branch to the BASE repo rather than a fork,
      # so the default read-only GITHUB_TOKEN reads this ref fine.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          repository: ${{ env.PR_HEAD_REPO }}
          persist-credentials: false

      # Flutter from the repo's own pin, never the image's. No `cache:` input:
      # the action saves through actions/cache (see the posture above).
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Regenerate pubspec.lock first: `pod install` resolves against the
      # Flutter plugin set, so a stale pubspec.lock yields a stale Podfile.lock.
      - name: Regenerate pubspec.lock
        # {{IF:NESTED_APP}}
        working-directory: '{{APP_DIR}}'
        # {{ENDIF}}
        run: flutter pub get

      # Full clean regeneration. A partial `pod update <name>` chases per-pod
      # constraint prompts and can leave the lock internally inconsistent.
      - name: Regenerate Podfile.lock
        working-directory: '{{APP_DIR}}/ios'
        run: |
          rm -f Podfile.lock
          pod install --repo-update

      # The ONLY thing that leaves this job: the two lockfiles, as the
      # difference from the PR head the checkout holds. The pathspecs name those
      # two files; --no-renames, --no-ext-diff and --no-textconv keep the patch
      # a plain one. The next job re-checks every line of it anyway.
      - name: Package the lockfile changes as a patch
        id: patch
        run: |
          set -euo pipefail
          nohooks=(-c core.hooksPath=/dev/null -c core.fsmonitor=false)
          out="$RUNNER_TEMP/pod-lock-out"
          mkdir -p "$out"
          git "${nohooks[@]}" diff HEAD --binary --no-renames --no-ext-diff --no-textconv -- '{{APP_DIR}}/pubspec.lock' '{{APP_DIR}}/ios/Podfile.lock' > "$out/pod-lock.patch"
          if [ ! -s "$out/pod-lock.patch" ]; then
            echo "::notice::pubspec.lock and Podfile.lock unchanged after regeneration — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.patch.outputs.changed == 'true' }}
        with:
          name: pod-lock-patch
          path: ${{ runner.temp }}/pod-lock-out/
          retention-days: 1
          if-no-files-found: error

  # JOB 2 — a FRESH ubuntu VM that runs no package manager. The patch from job 1
  # is untrusted: it is checked against the two paths this workflow owns and
  # applied with hooks off BEFORE the App token exists.
  push-pod-lock:
    needs: update-pod-lock
    if: ${{ github.actor == 'dependabot[bot]' && needs.update-pod-lock.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          repository: ${{ env.PR_HEAD_REPO }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pod-lock-patch
          path: ${{ runner.temp }}/pod-lock-in

      # Every rule here is about the patch, not about who made it. It may touch
      # a non-empty subset of exactly two paths, each at most once: the app's
      # pubspec.lock and its ios/Podfile.lock (at the repo root the
      # '{{APP_DIR}}/' prefix collapses to plain pubspec.lock and
      # ios/Podfile.lock). Git itself reports what the patch would do.
      - name: Validate and apply the lockfile patch
        run: |
          set -euo pipefail
          nohooks=(-c core.hooksPath=/dev/null -c core.fsmonitor=false)
          patch="$RUNNER_TEMP/pod-lock-in/pod-lock.patch"
          allowed=('{{APP_DIR}}/pubspec.lock' '{{APP_DIR}}/ios/Podfile.lock')
          reject() { echo "::error::Rejected the lockfile patch: $1"; exit 1; }
          [ -s "$patch" ] || reject "the artifact holds no patch"

          # git's own reading of the patch: any create, delete, rename, copy
          # or mode change shows up in --summary.
          summary="$(git "${nohooks[@]}" apply --summary -- "$patch")" || reject "git cannot parse it"
          [ -z "$summary" ] || reject "it creates, deletes, renames, copies or re-modes a file: $(echo "$summary" | tr '\n' ' ')"
          # -z: NUL-terminated records with the path unquoted. Without it git
          # C-quotes a path holding non-ASCII or special characters and no
          # compare ever matches. A file, not a variable: a variable drops NULs.
          numstat="$RUNNER_TEMP/numstat.z"
          git "${nohooks[@]}" apply --numstat -z -- "$patch" > "$numstat" || reject "git cannot parse it"
          seen=$'\n'
          # No IFS trimming: tab is IFS whitespace, so `read added removed path`
          # would strip a leading or trailing tab from the path and bind a file
          # named <TAB>bun.lock to bun.lock. Split the record on its first two
          # tabs by hand and refuse any path holding a tab or newline.
          while IFS= read -r -d '' rec; do
            added="${rec%%$'\t'*}"; rest="${rec#*$'\t'}"
            removed="${rest%%$'\t'*}"; path="${rest#*$'\t'}"
            case "$path" in
              ''|*$'\t'*|*$'\n'*) reject "a patched path is empty or holds a tab or newline" ;;
            esac
            [ "$added" != "-" ] || reject "$path is a binary change; the lockfiles are text"
            # git prints "0 0 path" for a patch it parses but that changes no
            # line (headers only); it never prints an empty numstat for one.
            [ "$added$removed" != "00" ] || reject "it changes nothing"
            listed=0
            for a in "${allowed[@]}"; do
              if [ "$path" = "$a" ]; then listed=1; fi
            done
            [ "$listed" -eq 1 ] || reject "$path is not an allowed lockfile path (${allowed[*]})"
            case "$seen" in
              *$'\n'"$path"$'\n'*) reject "$path appears more than once in the patch" ;;
            esac
            seen+="$path"$'\n'
            mode="$(git "${nohooks[@]}" ls-files -s -- ":(literal)$path" | cut -d' ' -f1)"
            [ "$mode" = "100644" ] || [ "$mode" = "100755" ] \
              || reject "$path is not a tracked regular file (mode '${mode:-untracked}'; a symlink is 120000, a submodule 160000)"
          done < "$numstat"

          git "${nohooks[@]}" apply --index -- "$patch"
          # Belt and braces: what is staged, and only that, is the set of paths
          # the validated patch named.
          staged="$(git "${nohooks[@]}" diff --cached --name-only -z | tr '\0' '\n' | sort)"
          expected="$(tr '\0' '\n' < "$numstat" | cut -f3 | sort)"
          [ "$staged" = "$expected" ] || reject "after applying, something other than the patched lockfiles is staged"
          # Captured first so a failing `git status` aborts under set -e; a
          # `$(git status | grep)` would read the failure as a clean tree.
          tree="$(git "${nohooks[@]}" status --porcelain --untracked-files=all)"
          if [ -n "$(grep -v '^M  ' <<<"$tree" || true)" ]; then
            reject "after applying, the tree holds changes outside the index"
          fi

      # Minted only now: after the patch is validated and applied, on a VM that
      # never ran a package manager. The presence step stays immediately before
      # the mint (it names the cause of an empty secret instead of an opaque
      # auth error).
      # A secret this repo cannot reach resolves to the EMPTY STRING, never an
      # error, so the mint below fails as an opaque auth error that reads as
      # unrelated to its cause (issue #178). Name the cause here.
      #
      # Org secrets at `private` visibility cover private + internal repos and
      # EXCLUDE public ones, in the Actions and Dependabot stores alike. Since
      # #186 setup-deps refuses to render ANY of the three App-token workflows
      # into a public repo, so this guard is the backstop for the copies that
      # predate that rule or were hand-copied: it names the cause instead of
      # failing as an opaque auth error.
      - name: Require the app credentials
        env:
          APP_CLIENT_ID: ${{ secrets.PLATFORM_WRITER_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.PLATFORM_WRITER_APP_PRIVATE_KEY }}
        run: |
          missing=
          [ -n "$APP_CLIENT_ID" ] || missing="$missing PLATFORM_WRITER_APP_CLIENT_ID"
          [ -n "$APP_KEY" ]       || missing="$missing PLATFORM_WRITER_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing Dependabot secret(s):$missing — org secrets are private-visibility and do not reach public repositories (Sassy-Dog/skills#178)."
            exit 1
          fi
          echo "App credentials present."

      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PLATFORM_WRITER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLATFORM_WRITER_APP_PRIVATE_KEY }}

      # The only step that needs repository write, and the only one holding
      # the credential. Pushing to an explicit URL rather than to `origin` is
      # what lets the checkout above stay credential-free. The validated patch
      # is already in the index; nothing else is.
      - name: Commit and push the lockfiles
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          # Every git call passes nohooks: a hook or fsmonitor program would
          # inherit GH_TOKEN from this step's environment. System and global
          # config are already off (job env).
          nohooks=(-c core.hooksPath=/dev/null -c core.fsmonitor=false)
          if git "${nohooks[@]}" diff --cached --quiet; then
            echo "::error::The validated patch left nothing staged."
            exit 1
          fi
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git "${nohooks[@]}" commit -m "chore(deps): regenerate pubspec.lock + Podfile.lock for Dependabot pub bump"
          # The token is never in argv or a URL: the single-quoted helper is
          # expanded by the shell git spawns, which reads GH_TOKEN from the
          # environment at run time. The empty helper first clears any other.
          # The push is leased to the head SHA both jobs checked out: if the
          # branch moved or was deleted since, it fails closed instead of
          # overwriting the new tip or recreating the branch.
          # shellcheck disable=SC2016  # deliberately unexpanded: git's shell expands it
          git "${nohooks[@]}" -c credential.helper= \
            -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
            push --force-with-lease="refs/heads/${PR_HEAD_REF}:${PR_HEAD_SHA}" \
            "https://github.com/${PR_HEAD_REPO}.git" "HEAD:refs/heads/${PR_HEAD_REF}"
