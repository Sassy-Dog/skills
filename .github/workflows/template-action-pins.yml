name: Template action pins (Dependabot tracking only)

# THIS WORKFLOW NEVER RUNS. It exists so this repo's own Dependabot
# (`github-actions`, directory "/", see .github/dependabot.yml) has a
# `uses:` line to bump for every action the setup-deps workflow templates pin.
# Dependabot scans only .github/workflows/, never
# skills/setup-deps/references/templates/, so without this file the template
# pins drift behind every consumer repo's Dependabot (#564).
#
# scripts/test-template-action-pins.sh asserts every action SHA pinned in
# skills/setup-deps/references/templates/*.template.yml equals the SHA pinned
# here for the same action, with the same version comment. A Dependabot bump
# to this file therefore fails CI until the templates follow, in the same PR.
#
# Why it is safe on a PUBLIC repo with fork PRs: manual trigger only, no
# token permissions at all, and the one job's `if:` can never be true (the only event is workflow_dispatch; actionlint rejects a literal `if: false`), so no step ever
# starts and no secret is read. Do not add a trigger, a permission, a secret
# or a `run:` step here, and do not delete the file as dead weight.

on:
  workflow_dispatch:

permissions: {}

jobs:
  pins:
    if: github.event_name == 'never-fires'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
