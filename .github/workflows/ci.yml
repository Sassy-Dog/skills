name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Required for the merge queue: without this the queue builds a merge_group
  # ref, no check ever reports against it, and entries sit until they time out.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a merge_group run — cancelling one ejects the entry from
  # the queue. Only PR-branch runs are safe to supersede.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    # GitHub-hosted, deliberately. This repo is public, `pull_request` fires for
    # fork PRs, and this job has no actor guard — on a self-hosted runner that
    # means anyone on the internet can execute code on Sassy Dog infrastructure,
    # with runner persistence exposing whatever privileged jobs left behind.
    # An ephemeral hosted runner removes the class outright. Do not move this
    # back to `[self-hosted, …]` while the repo is public and this trigger is
    # unguarded.
    runs-on: ubuntu-latest
    # A hung gate must fail the run, not hold a merge-queue slot for the 6 h
    # platform default. The run takes about 5 minutes; 30 is generous.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installed rather than inherited from the image ON PURPOSE: the gate is
      # shellcheck -S warning, whose findings are version-dependent, so a job
      # that inherits whatever the runner image happens to ship can go red on an
      # image bump nobody made. Pinning here makes CI reproducible.
      #
      # It does NOT make CI and local agree: scripts/preflight.sh carries no
      # shellcheck pin and lints with whatever is on the contributor's PATH, so
      # a local pass on a different version is not proof of a green build.
      # CONTRIBUTING.md says so out loud rather than pretending otherwise.
      #
      # The download is sha256-verified before it is unpacked. Note the weaker
      # provenance here than for actionlint below: shellcheck publishes no
      # checksums file, and its release assets carry no digest in the Releases
      # API, so the value below was computed locally from the downloaded tarball
      # (#182). That attests the artifact has not changed SINCE it was pinned —
      # it is not a vendor attestation that the artifact is what upstream built.
      # Pin the version and the checksum TOGETHER, never one without the other.
      - name: Install shellcheck (pinned + sha256-verified)
        env:
          SHELLCHECK_VERSION: v0.10.0
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz
          mkdir -p "$HOME/.local/bin"
          mv "shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$HOME/.local/bin/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # All gates live in scripts/preflight.sh (single source of truth for the
      # guard regexes — run the same script locally before a PR). It skips
      # actionlint under CI=true; the pinned-binary step below owns that gate
      # here. The scripts/test-*.sh gates run in parallel inside it,
      # PREFLIGHT_JOBS slots at a time (default: the runner's CPU count, 4 on
      # ubuntu-latest; the longest gate shards itself on top of that, so the
      # process count can exceed it), which is why this stays ONE step of ONE
      # job (#567).
      - name: Preflight gates (shellcheck, frontmatter, guards, manifests, markdownlint)
        run: bash scripts/preflight.sh

      # Native binary rather than the dockerized action. Docker with working
      # bind-mounts IS available on hosted runners, so the original reason for
      # this (the self-hosted fleet's rootless daemon could not mount the
      # workspace) no longer applies — but the pinned binary is still the better
      # choice: no image pull, and the version stays visible next to the pin it
      # has to agree with. Same rationale as the shellcheck step above.
      #
      # sha256-verified before unpacking, and the value is the VENDOR's: the
      # linux_amd64 line from actionlint_<ver>_checksums.txt on the same release
      # tag, independently confirmed by downloading the tarball and hashing it.
      # That is stronger provenance than the shellcheck pin above, which has no
      # vendor value to check against. When bumping, take the new version and
      # its checksum from that same file together (#182).
      - name: Install actionlint (pinned + sha256-verified)
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz actionlint
          mkdir -p "$HOME/.local/bin"
          mv actionlint "$HOME/.local/bin/actionlint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: actionlint
        run: actionlint -color

      # Bare actionlint above lints the real `.github/workflows/*`, including
      # the release-lag reminder. The three workflow TEMPLATES setup-deps renders
      # into every consumer repo were otherwise linted by nothing, while being
      # the highest-consequence YAML in the tree (issue #245). They cannot be
      # linted in place: their render-time placeholders parse as errors that
      # are not defects, so this gate renders each template in every documented
      # shape and lints the renders.
      #
      # A separate step rather than part of preflight because $GITHUB_PATH
      # reaches only LATER steps: preflight runs before the install above and
      # cannot see actionlint at all. The script skips a missing actionlint
      # locally but FAILS on one under CI=true, so this step cannot no-op.
      - name: actionlint (setup-deps workflow templates)
        run: bash scripts/test-template-actionlint.sh
